<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GINA · 数字意识控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060a;
    --cyan:#39e0ff;      /* Gina 左眼青 */
    --violet:#9a6cff;    /* Gina 右眼紫 */
    --tx:#e8edf6;
    --dim:#7a86a0;
    --faint:#3d465a;
    --ok:#3ddc97;
    --danger:#ff4d5e;
    --line:rgba(120,160,255,0.22);
    --line-hi:rgba(140,200,255,0.6);
    --chip:rgba(10,16,28,0.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'JetBrains Mono','Orbitron','PingFang SC',sans-serif;color:var(--tx)}
  #scene{position:fixed;inset:0;display:block}
  /* 背景网格呼吸 */
  .bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:54px 54px;opacity:.22;mask-image:radial-gradient(circle at 50% 45%,#000 30%,transparent 75%)}
  .bg-vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(3,4,8,.85) 100%)}

  /* 顶栏 */
  .topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:5;display:flex;align-items:center;gap:20px;padding:0 32px;
    background:linear-gradient(to bottom,rgba(5,6,10,.9),transparent);pointer-events:none}
  .brand{display:flex;align-items:center;gap:12px;pointer-events:auto}
  .brand .mark{width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line-hi);transform:rotate(45deg)}
  .brand .mark i{width:8px;height:8px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
  .brand b{font-family:'Orbitron';font-weight:600;letter-spacing:.3em;font-size:15px;color:var(--tx)}
  .brand span{font-size:9px;letter-spacing:.24em;color:var(--dim)}
  .top-status{margin-left:auto;display:flex;align-items:center;gap:18px;pointer-events:auto;font-size:10px;letter-spacing:.12em}
  .stat{display:flex;align-items:center;gap:7px}
  .stat .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .stat.ok .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .stat .lbl{color:var(--dim)}
  .stat b{font-weight:500;color:var(--tx)}
  #time{font-family:'Orbitron';font-size:15px;letter-spacing:.18em;color:var(--tx);text-shadow:0 0 12px rgba(120,200,255,.4)}

  /* 四角 HUD */
  .hud{position:fixed;z-index:4;background:var(--chip);border:1px solid var(--line);clip-path:polygon(0 0,12px 0,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);padding:14px 16px;min-width:200px;backdrop-filter:blur(3px)}
  .hud::before{content:'';position:absolute;top:0;left:0;width:34px;height:1px;background:var(--line-hi)}
  .hud-title{font-size:9px;letter-spacing:.26em;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .hud-title::before{content:'';width:6px;height:6px;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
  .hud-row{display:flex;justify-content:space-between;gap:14px;font-size:11px;margin:6px 0}
  .hud-row span{color:var(--dim);letter-spacing:.12em}
  .hud-row b{font-weight:500;letter-spacing:.04em;color:var(--tx)}
  .hud-row b.cyan{color:var(--cyan)} .hud-row b.violet{color:var(--violet)} .hud-row b.ok{color:var(--ok)}
  .bars{display:flex;gap:3px;margin:8px 0}
  .bars i{width:6px;height:13px;background:rgba(140,190,255,.12)}
  .bars i.on{background:var(--cyan);box-shadow:0 0 6px rgba(57,224,255,.6)}
  #hudTL{left:26px;top:84px}#hudTR{right:26px;top:84px}#hudBL{left:26px;bottom:26px}#hudBR{right:26px;bottom:26px}

  /* 左侧意识条 */
  #consState{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:4;width:210px;padding:16px 18px;background:var(--chip);border:1px solid var(--line);clip-path:polygon(0 0,14px 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px))}
  #consState h4{font-size:9px;letter-spacing:.26em;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  #consState h4::before{content:'';width:6px;height:6px;background:var(--violet);box-shadow:0 0 6px var(--violet)}
  #mood{font-family:'Orbitron';font-size:20px;letter-spacing:.14em;color:var(--tx);text-shadow:0 0 14px rgba(154,108,255,.5);margin-bottom:12px}
  #wave{width:100%;height:38px;display:block}
  #scale{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.16em;color:var(--faint);margin-top:5px}

  /* 右侧思维流 */
  #thought{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:4;width:250px;padding:16px 18px;background:var(--chip);border:1px solid var(--line);clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
  #thought h4{font-size:9px;letter-spacing:.26em;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  #thought h4::before{content:'';width:6px;height:6px;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
  #thoughtList{max-height:230px;overflow:hidden;display:flex;flex-direction:column;gap:8px}
  .t-elem{font-size:10.5px;line-height:1.5;color:var(--dim);border-left:2px solid var(--line);padding:2px 0 2px 10px;opacity:0;animation:tIn .4s forwards}
  .t-elem b{color:var(--tx);font-weight:500}
  @keyframes tIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}

  /* 底部命令 */
  #console{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;width:640px;max-width:92%;background:var(--chip);border:1px solid var(--line);backdrop-filter:blur(4px)}
  #console::before{content:'';position:absolute;top:-1px;left:0;width:60px;height:1px;background:var(--line-hi)}
  #reply{min-height:20px;max-height:120px;overflow:auto;margin:12px 16px 8px;font-size:12px;line-height:1.7;color:var(--tx);font-family:'JetBrains Mono',monospace}
  #reply .me{color:var(--cyan)} #reply .gina{color:var(--tx)}
  .composer{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 12px}
  .composer::before{content:'❯';color:var(--cyan);font-weight:700;padding-left:4px}
  #chatInput{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font:13px 'JetBrains Mono',monospace;letter-spacing:.02em}
  #chatInput::placeholder{color:var(--faint)}
  .icon-btn{flex:none;width:32px;height:32px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);color:var(--dim);cursor:pointer;transition:.2s}
  .icon-btn:hover{color:var(--tx);border-color:var(--line-hi)}
  .icon-btn.rec{color:var(--danger);animation:rec 1.1s infinite}
  @keyframes rec{0%,100%{opacity:1}50%{opacity:.35}}
  .send{padding:0 16px;height:32px;background:var(--cyan);border:none;color:#04121a;font-family:'Orbitron';font-size:11px;letter-spacing:.22em;font-weight:600;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%)}
  .send:hover{filter:brightness(1.15)}

  .power{position:fixed;right:26px;bottom:96px;z-index:6;display:flex;gap:6px}
  .panel{position:fixed;right:26px;bottom:150px;z-index:6;width:280px;background:var(--chip);border:1px solid var(--line);padding:14px 16px;display:none}
  .panel.open{display:block}
  .panel h4{font-size:9px;letter-spacing:.26em;color:var(--dim);margin-bottom:10px}
  .prow{display:flex;justify-content:space-between;font-size:11px;margin:5px 0}
  .prow span{color:var(--dim)} .prow b{font-weight:500}

  @media(max-width:900px){.hud,#consState,#thought{display:none}#console{width:94%;bottom:20px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="bg-grid"></div>
<div class="bg-vignette"></div>

<!-- 顶栏 -->
<div class="topbar">
  <div class="brand"><div class="mark"><i></i></div><div><b>GINA</b><br><span>DIGITAL CONSCIOUSNESS</span></div></div>
  <div class="top-status">
    <div class="stat" id="stCore"><span class="dot"></span><span class="lbl">CORE</span><b id="coreTxt">BOOT</b></div>
    <div class="stat" id="stNet"><span class="dot"></span><span class="lbl">LINK</span><b id="netTxt">OFFLINE</b></div>
    <div id="time">00:00:00</div>
  </div>
</div>

<!-- 四角 HUD -->
<div class="hud" id="hudTL">
  <div class="hud-title">MEMORY // SYSTEM</div>
  <div class="hud-row"><span>记忆节点</span><b id="mMem">—</b></div>
  <div class="hud-row"><span>会话数</span><b id="mSess">—</b></div>
  <div class="hud-row"><span>知识库</span><b class="ok" id="mKnow">ACTIVE</b></div>
</div>
<div class="hud" id="hudTR">
  <div class="hud-title">PROVIDER // LLM</div>
  <div class="hud-row"><span>模型</span><b class="cyan" id="pModel">—</b></div>
  <div class="hud-row"><span>状态</span><b class="ok" id="pStatus">IDLE</b></div>
  <div class="bars" id="pBars"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
</div>
<div class="hud" id="hudBL">
  <div class="hud-title">TASK // RUNNING</div>
  <div id="taskBody"><div class="hud-row"><span>当前任务</span><b>—</b></div></div>
</div>
<div class="hud" id="hudBR">
  <div class="hud-title">ENERGY // OUTPUT</div>
  <div class="bars" id="eBars"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
  <div class="hud-row"><span>心跳 TICK</span><b class="cyan" id="eTick">0</b></div>
</div>

<!-- 左侧意识状态 -->
<div id="consState">
  <h4>CONSCIOUSNESS</h4>
  <div id="mood">BOOT</div>
  <canvas id="wave" width="176" height="38"></canvas>
  <div id="scale"><span>CALM</span><span>THINK</span><span>SPEAK</span></div>
</div>

<!-- 右侧思维流 -->
<div id="thought">
  <h4>THOUGHT STREAM</h4>
  <div id="thoughtList"></div>
</div>

<!-- 底部命令台 -->
<div id="console">
  <div id="reply"></div>
  <div class="composer">
    <button class="icon-btn" id="voiceBtn" title="语音输入"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input id="chatInput" placeholder="向 GINA 下达指令……" autocomplete="off"/>
    <button class="send" id="sendBtn">EXECUTE</button>
  </div>
</div>
<div class="power">
  <button class="icon-btn" id="tglTask" title="任务状态"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
  <button class="icon-btn" id="tglSys" title="系统"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>
<div class="panel" id="sysPanel"><h4>SYSTEM // DIAGNOSTICS</h4><div id="sysBody"></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';

// ========== THREE 全息核心 ==========
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x05060a,1);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x05060a,0.012);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);
camera.position.set(0,0,8.2);

const CORE=new THREE.Color(0x9a6cff), EDGE=new THREE.Color(0x39e0ff);

function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d').createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(220,240,255,0.9)');g.addColorStop(.3,'rgba(140,200,255,0.35)');g.addColorStop(1,'rgba(0,0,0,0)');const x=c.getContext('2d');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}

// 核心能量球（紫青渐变菲涅尔）
const coreGeo=new THREE.IcosahedronGeometry(1.55,4);
const coreMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.FrontSide,
 uniforms:{uTime:{value:0},uC:{value:CORE},uE:{value:EDGE}},
 vertexShader:`varying vec3 vN,vV;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`varying vec3 vN,vV;uniform float uTime;uniform vec3 uC,uE;
void main(){float fr=pow(1.-abs(dot(normalize(vN),normalize(vV))),2.5);
 float s1=sin(gl_FragCoord.y*.06+uTime*3.)*.5+.5,s2=sin(gl_FragCoord.x*.05-uTime*2.)*.5+.5;
 float en=(s1+s2)*.5;float a=.10+fr*.72+en*.20;vec3 c=mix(uC,uE,fr);c+=fr*.5+en*.22;
 gl_FragColor=vec4(c,clamp(a,0.,1.));}`});
const core=new THREE.Mesh(coreGeo,coreMat);scene.add(core);
const inner=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:0xdccbff,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.75}));
inner.scale.set(2.5,2.5,1);core.add(inner);

// 球面点阵
const N=9000,pos=new Float32Array(N*3),g=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),t=g*i,jr=1+(Math.random()-.5)*.1;
pos[i*3]=Math.cos(t)*r*1.53*jr;pos[i*3+1]=y*1.53*jr;pos[i*3+2]=Math.sin(t)*r*1.53*jr;}
const dots=new THREE.Object3D();
const dotG=new THREE.BufferGeometry();dotG.setAttribute('position',new THREE.BufferAttribute(pos,3));
const dotM=new THREE.PointsMaterial({color:0xbcd8ff,size:.028,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending});
const dotMesh=new THREE.Points(dotG,dotM);dots.add(dotMesh);core.add(dots);

// 交叉光环（紫青）
const ringMat=new THREE.MeshBasicMaterial({color:0x9adcff,transparent:true,opacity:.32,depthWrite:false,blending:THREE.AdditiveBlending});
const glowM1=new THREE.MeshBasicMaterial({color:0x9adcff,transparent:true,opacity:.10,depthWrite:false,blending:THREE.AdditiveBlending});
const glowM2=new THREE.MeshBasicMaterial({color:0x9a6cff,transparent:true,opacity:.06,depthWrite:false,blending:THREE.AdditiveBlending});
const cross=new THREE.Group();
function mkRing(v){const grp=new THREE.Group();for(let i=0;i<6;i++){const r=1.9+i*.05;
 grp.add(new THREE.Mesh(new THREE.TorusGeometry(r,.015,8,200),glowM1));
 grp.add(new THREE.Mesh(new THREE.TorusGeometry(r,.004,8,200),ringMat));
 grp.add(new THREE.Mesh(new THREE.TorusGeometry(r,.07,8,200),glowM2));}
 if(v)grp.rotation.x=Math.PI/2;return grp}
cross.add(mkRing(false));cross.add(mkRing(true));cross.rotation.z=.5;scene.add(cross);

// 线框球
const wireI=new THREE.IcosahedronGeometry(3.7,2);
const wireMat=new THREE.MeshBasicMaterial({color:0x9adcff,wireframe:true,transparent:true,opacity:.10,depthWrite:false,blending:THREE.AdditiveBlending});
const wire=new THREE.Mesh(wireI,wireMat);scene.add(wire);

// 卫星
const sats=[{r:4.1,rx:Math.PI/2+.3,s:.5,a:0},{r:4.8,rx:Math.PI/2-.5,s:-.38,a:Math.PI},{r:5.5,rx:Math.PI/2,s:.3,a:Math.PI/2}];
const satGrp=new THREE.Group();satGrp.rotation.z=.5;scene.add(satGrp);
const satPts=[];
for(const s of sats){const o=new THREE.Mesh(new THREE.TorusGeometry(s.r,.006,8,200),new THREE.MeshBasicMaterial({color:0x9adcff,transparent:true,opacity:.3,depthWrite:false,blending:THREE.AdditiveBlending}));o.rotation.x=Math.PI/2;
 const grp=new THREE.Group();grp.rotation.x=s.rx;grp.add(o);
 const sg=new THREE.SphereGeometry(.06,8,8);const sm=new THREE.MeshBasicMaterial({color:0xe9fbff,transparent:true,opacity:.95});
 const sat=new THREE.Mesh(sg,sm);grp.add(sat);satGrp.add(grp);satPts.push({sat,r:s.r,sp:s.s,a:s.a});}

// 上升流星
const M=70,T=12,mp=new Float32Array(M*T*3),mt=new Float32Array(M*T),met=[];
for(let m=0;m<M;m++){met.push({x:(Math.random()-.5)*20,z:(Math.random()-.5)*20,y:-4+Math.random()*4,sp:.02+Math.random()*.04});
 for(let k=0;k<T;k++)mt[m*T+k]=k/(T-1);}
const mgeo=new THREE.BufferGeometry();mgeo.setAttribute('position',new THREE.BufferAttribute(mp,3));mgeo.setAttribute('aTrail',new THREE.BufferAttribute(mt,1));
const mmat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:`attribute float aTrail;varying float vT;void main(){vT=aTrail;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=(1.-vT)*5.+1.5;gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`varying float vT;void main(){float d=length(gl_PointCoord-vec2(.5));if(d>.5)discard;gl_FragColor=vec4(vec3(.72,.85,1.),(1.-vT)*.8*(1.-smoothstep(0.,.5,d)));}`});
const mpart=new THREE.Points(mgeo,mmat);scene.add(mpart);

// 波浪地面
const GC=120,GR=120,GP=GC*GR,gp=new Float32Array(GP*3),gj=new Float32Array(GP*2);
for(let i=0;i<GP;i++){gj[i*2]=(Math.random()-.5)*.12;gj[i*2+1]=(Math.random()-.5)*.12;}
const ggeo=new THREE.BufferGeometry();ggeo.setAttribute('position',new THREE.BufferAttribute(gp,3));
const gmat=new THREE.PointsMaterial({color:0x8fb4ff,size:.08,map:glowTex(),transparent:true,opacity:.4,depthWrite:false,blending:THREE.AdditiveBlending});
const ground=new THREE.Points(ggeo,gmat);ground.position.y=-3.9;scene.add(ground);

const wideGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.32}));
wideGlow.scale.set(6,6,1);scene.add(wideGlow);

// ========== 交互 ==========
let intensity=0;   // 0 平淡 ~ 1 活跃
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
 core.rotation.y=t*.22;coreMat.uniforms.uTime.value=t;
 core.scale.setScalar(1+Math.sin(t*1.2)*.04*(0.4+intensity*.6));
 inner.scale.setScalar(2.5*(1+Math.sin(t*1.35)*.16));
 cross.rotation.x=t*.3+Math.sin(t*.35)*.3;cross.rotation.z+=.0006;
 satGrp.rotation.x=-t*.2;
 wire.rotation.y=-t*.1;wire.rotation.z=t*.06;
 for(const s of satPts){s.a+=s.sp*.02;s.sat.position.set(Math.cos(s.a)*s.r,0,Math.sin(s.a)*s.r);}
 for(let m=0;m<M;m++){const o=met[m];o.y+=o.sp;if(o.y>3){o.y=-4;o.x=(Math.random()-.5)*20;o.z=(Math.random()-.5)*20;}
  for(let k=0;k<T;k++){const i=(m*T+k)*3;mp[i]=o.x;mp[i+1]=o.y-k*.13;mp[i+2]=o.z;}}
 mpart.geometry.attributes.position.needsUpdate=true;
 for(let i=0;i<GP;i++){const c=i%GC,r=(i/GC)|0,x=(c/(GC-1)-.5)*22+gj[i*2],z=(r/(GR-1)-.5)*22+gj[i*2+1];
  gp[i*3]=x;gp[i*3+1]=Math.sin(x*.4+t*1.)*.18+Math.cos(z*.5+t*.8)*.18;gp[i*3+2]=z;}
 ground.geometry.attributes.position.needsUpdate=true;
 wideGlow.material.opacity=.3+Math.sin(t*1.6)*.1+intensity*.15;
 renderer.render(scene,camera);}
animate();

// ========== 后端连接 ==========
const API=location.origin.startsWith('http')?location.origin:'http://127.0.0.1:3721';
const $=id=>document.getElementById(id);
function setStatus(el,txt){el.querySelector('b').textContent=txt}
function barFill(el,n,total){const b=el.querySelectorAll('i');let on=Math.round(n/total*b.length);b.forEach((x,i)=>x.className=i<on?'on':'')}

// 心跳波形
function drawWave(live){const c=$('wave'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
 x.beginPath();x.strokeStyle='rgba(154,108,255,.9)';x.lineWidth=1.5;
 for(let i=0;i<c.width;i++){const t=i/c.width*Math.PI*2+perf;
  const v=live?Math.sin(t*3)*(.3+intensity*.7)+Math.sin(t*7)*.2:Math.sin(t)*.15;
  const y=c.height/2+v*c.height*.4*(0.3+intensity*.7);i?x.lineTo(i,y):x.moveTo(i,y);}x.stroke();}
let perf=0;setInterval(()=>{perf+=.12;drawWave(state.live)},50);

const state={live:false,mood:'BOOT'};
function setMood(m){state.mood=m;$('mood').textContent=m;const hot=m==='SPEAK'?Math.min(1,intensity+.2):m==='THINK'?.75:.45;
 $('coreTxt').textContent=m==='BOOT'?'BOOT':'ONLINE';$('coreTxt').parentElement.classList.add('ok');}

// 思维流
function pushThought(text){const l=$('thoughtList');const d=document.createElement('div');d.className='t-elem';
 const ic=text.startsWith('工具')?'cyan':'violet';d.innerHTML=`<b style="color:var(--${ic})">▸</b> ${text}`;
 l.prepend(d);while(l.children.length>6)l.lastChild.remove();}

// 任务面板
function renderTask(snap){const body=$('taskBody');
 body.innerHTML='';
 const rows=snap.task?[[snap.task,'']]:[];
 if(snap.taskSteps&&snap.taskSteps.length){snap.taskSteps.forEach(s=>rows.push([s.status==='done'?'✓ ':'○ '+s.text,s.note||'']));}
 if(!rows.length)rows.push(['空闲','']);
 const divs=rows.slice(0,4).map(r=>`<div class="hud-row"><span>${r[1]?r[1]:''}</span><b>${r[0].slice(0,18)}</b></div>`).join('');
 body.innerHTML=divs;}

// 系统面板
function renderSys(s){const b=$('sysBody');b.innerHTML=
 [['循环','RUNNING'],['会话',s.sessionCounter||0],['TICK',s.tickCounter||0],['动作',(s.recentActions||[]).length],['思维栈',(s.thoughtStack||[]).length]]
 .map(([k,v])=>`<div class="prow"><span>${k}</span><b>${v}</b></div>`).join('');}

// 拉取 /status 快照
async function fetchStatus(){try{const r=await fetch(`${API}/status`);const d=await r.json();return d}catch(e){return null}}
// 订阅 SSE 事件
function connectEvents(){try{const es=new EventSource(`${API}/events`);
 es.addEventListener('open',()=>{state.live=true;netOn(true)});
 es.onerror=()=>{state.live=false;netOn(false)};
 es.addEventListener('stream_start',e=>{setMood('SPEAK')});
 es.addEventListener('stream_end',e=>{setMood('IDLE')});
 es.addEventListener('message',e=>{try{const d=JSON.parse(e.data);if(d.text){addReply(d.text,'gina')}setMood('IDLE')}catch{}});
}catch(e){netOn(false)}}
function netOn(on){$('netTxt').textContent=on?'ONLINE':'OFFLINE';$('netTxt').parentElement.classList.toggle('ok',on)}

// 刷新 HUD
async function refresh(){const st=await fetchStatus();
 if(st){state.live=true;netOn(true);
  $('mMem').textContent=st.memories??'—';$('mSess').textContent=st.sessionCounter??'—';
  $('pModel').textContent=st.model||'—';$('pStatus').textContent=st.action||'IDLE';
  barFill($('pBars'),(st.quotaPct??0.5)*100,100);barFill($('eBars'),(st.energy??0.5)*100,100);
  $('eTick').textContent=st.tickCounter||0;
  renderTask(st);renderSys(st);
 } else {setStatus($('stNet'),'--')}}
setInterval(refresh,4000);refresh();

// 聊天
const input=$('chatInput'),reply=$('reply');
function addReply(t,cls){const d=document.createElement('div');d.className=cls;d.textContent=(cls==='me'?'❯ ':'GINA · ')+t;reply.appendChild(d);reply.scrollTop=reply.scrollHeight;}
function send(){const v=input.value.trim();if(!v)return;input.value='';addReply(v,'me');
 pushThought('命令 → 后端');setMood('THINK');
 try{fetch(`${API}/message`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,from_id:'ui',channel:'ui'})}).then(()=>{pushThought('已下发 · 等待响应');setMood('SPEAK')}).catch(()=>{addReply('后端离线，仅演示。','gina');setMood('IDLE')})}catch(e){addReply('无法连接后端，仅演示。','gina');setMood('IDLE')}}
$('sendBtn').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});
$('voiceBtn').onclick=()=>$('voiceBtn').classList.toggle('rec');
$('tglTask').onclick=()=>{$('sysPanel').classList.toggle('open');$('sysPanel').querySelector('h4').textContent='TASK // STATUS'};
$('tglSys').onclick=()=>{const p=$('sysPanel');p.classList.toggle('open');if(p.classList.contains('open'))p.querySelector('h4').textContent='SYSTEM // DIAGNOSTICS'};

// 时钟
function clk(){const n=new Date();$('time').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')}
setInterval(clk,1000);clk();
setMood('BOOT');
addReply('全息核心已上线。指令 / 语音 / 视觉流已就绪。','gina');

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
