<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checkout — Zichen-Runelith</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  body { background: #FAF7F2; color: #1A1410; }
  .page { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; justify-content: center;
    height: 56px; padding: 0 20px;
    background: rgba(250,247,242,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(160,152,136,0.12);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar .back { position: absolute; left: 16px; cursor: pointer; color: #1A1410; }
  .topbar h1 { font-size: 17px; font-weight: 600; }

  .content { flex: 1; padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }

  .section {
    background: #fff;
    border: 1px solid rgba(160,152,136,0.1);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .section h3 {
    font-size: 15px; font-weight: 600; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section h3 .num {
    width: 24px; height: 24px;
    background: #1A1410; color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: #A09888; margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%; padding: 12px 16px;
    background: #F5F0E8; border: 1px solid rgba(160,152,136,0.15);
    border-radius: 12px; font-size: 14px; color: #1A1410;
    outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: #C9A24B; }

  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  .payment-options { display: flex; flex-direction: column; gap: 10px; }
  .payment-opt {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: #F5F0E8;
    border: 1px solid rgba(160,152,136,0.15);
    border-radius: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .payment-opt:hover { border-color: #C9A24B; }
  .payment-opt.active { border-color: #C9A24B; background: rgba(201,162,75,0.06); }
  .payment-opt .radio {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid rgba(160,152,136,0.3);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .payment-opt.active .radio { border-color: #C9A24B; }
  .payment-opt.active .radio::after {
    content: ''; width: 8px; height: 8px;
    background: #C9A24B; border-radius: 50%;
  }
  .payment-opt .icon { font-size: 20px; }
  .payment-opt .text { font-size: 14px; font-weight: 500; }

  .order-summary { background: #F5F0E8; border-radius: 12px; padding: 16px; }
  .summary-row {
    display: flex; justify-content: space-between;
    padding: 8px 0; font-size: 14px; color: #6B6058;
  }
  .summary-row.total {
    border-top: 1px solid rgba(160,152,136,0.2);
    padding-top: 12px; margin-top: 4px;
    font-weight: 700; font-size: 16px; color: #1A1410;
  }
  .summary-row.total .price { font-family: "Fira Code", monospace; color: #C9A24B; }

  .place-order-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #C9A24B, #A87F2E);
    border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; color: #fff;
    cursor: pointer; margin-top: 24px;
    box-shadow: 0 4px 16px rgba(201,162,75,0.3);
    transition: all 0.2s;
  }
  .place-order-btn:hover { transform: translateY(-1px); }

  .tab-spacer { height: 40px; }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <a class="back" href="cart.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 data-i18n="checkout.title">Checkout</h1>
  </div>

  <div class="content">
    <!-- Shipping -->
    <div class="section">
      <h3><span class="num">1</span> <span data-i18n="checkout.shipping">Shipping Address</span></h3>
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" placeholder="John">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" placeholder="Doe">
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" placeholder="123 Crystal Lane">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>City</label>
          <input type="text" placeholder="New York">
        </div>
        <div class="form-group">
          <label>Zip Code</label>
          <input type="text" placeholder="10001">
        </div>
      </div>
    </div>

    <!-- Payment -->
    <div class="section">
      <h3><span class="num">2</span> <span data-i18n="checkout.payment">Payment Method</span></h3>
      <div class="payment-options">
        <div class="payment-opt active" onclick="selectPayment(this)">
          <div class="radio"></div>
          <div class="icon">💳</div>
          <div class="text" data-i18n="checkout.card">Credit/Debit Card</div>
        </div>
        <div class="payment-opt" onclick="selectPayment(this)">
          <div class="radio"></div>
          <div class="icon">🅿️</div>
          <div class="text" data-i18n="checkout.paypal">PayPal</div>
        </div>
      </div>
    </div>

    <!-- Order Summary -->
    <div class="section">
      <h3><span class="num">3</span> <span data-i18n="checkout.summary">Order Summary</span></h3>
      <div class="order-summary" id="order-summary"></div>
    </div>

    <button class="place-order-btn" onclick="placeOrder()" data-i18n="checkout.place_order">Place Order</button>
    <div class="tab-spacer"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
  function renderSummary() {
    const items = Cart.get();
    const subtotal = items.reduce((s, item) => s + item.price * item.qty, 0);
    const shipping = subtotal > 100 ? 0 : 9.99;
    const total = subtotal + shipping;

    document.getElementById('order-summary').innerHTML = `
      ${items.map(item => `
        <div class="summary-row">
          <span>${item.name} × ${item.qty}</span>
          <span style="font-family:'Fira Code',monospace">$${(item.price * item.qty).toFixed(2)}</span>
        </div>
      `).join('')}
      <div class="summary-row">
        <span>Shipping</span>
        <span style="font-family:'Fira Code',monospace">${shipping === 0 ? 'Free' : '$' + shipping.toFixed(2)}</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span class="price">$${total.toFixed(2)}</span>
      </div>
    `;
  }

  function selectPayment(el) {
    $$('.payment-opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
  }

  function placeOrder() {
    showToast('Order placed successfully! 🎉');
    Cart.clear();
    setTimeout(() => location.href = 'index.html', 2000);
  }

  renderSummary();
  I18n.init();
</script>
</body>
</html>
