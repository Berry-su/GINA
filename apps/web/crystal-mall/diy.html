<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Design — Zichen-Runelith</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  body { background: #FAF7F2; color: #1A1410; }

  .page { min-height: 100vh; display: flex; flex-direction: column; }

  /* ── Top Bar ─────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: center;
    height: 56px; padding: 0 20px;
    background: rgba(250,247,242,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(160,152,136,0.12);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar .back {
    position: absolute; left: 16px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #1A1410;
  }
  .topbar h1 { font-family: "PingFang SC", serif; font-size: 17px; font-weight: 600; }
  .topbar .menu {
    position: absolute; right: 16px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #A09888; font-size: 18px;
  }

  /* ── Stats Bar ─────────────── */
  .stats-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: #fff;
    border-bottom: 1px solid rgba(160,152,136,0.1);
    font-size: 13px;
  }
  .stat { display: flex; align-items: center; gap: 6px; color: #6B6058; }
  .stat .val {
    font-family: "Fira Code", monospace;
    font-weight: 600; font-size: 16px; color: #C9A24B;
  }
  .stat .unit { font-size: 12px; color: #A09888; }

  /* ── Fit Status ─────────────── */
  .fit-status {
    text-align: center;
    padding: 8px 20px;
    font-size: 12px; color: #A09888;
    background: #fff;
  }

  /* ── Plate Area ─────────────── */
  .plate-area {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    min-height: 340px;
    background: linear-gradient(180deg, #fff 0%, #F5F0E8 100%);
  }

  .plate {
    width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #f0ebe4, #e4ddd4, #d8d0c6);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.08),
      inset 0 2px 8px rgba(255,255,255,0.7),
      inset 0 -2px 8px rgba(0,0,0,0.06);
    position: relative;
  }
  .plate::after {
    content: ''; position: absolute; inset: 8px;
    border-radius: 50%; border: 1px solid rgba(201,162,75,0.15);
  }
  .plate-watermark {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: "PingFang SC", serif;
    font-size: 24px; color: rgba(160,152,136,0.25);
    pointer-events: none;
  }
  .plate-hint {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px; color: #B9B6C9;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ── Beads on plate ─────────────── */
  .plate-bead {
    position: absolute;
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 2;
  }
  .plate-bead:hover { transform: scale(1.2); z-index: 3; }

  /* ── Side Buttons ─────────────── */
  .side-btns {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 8px;
  }
  .side-btn {
    padding: 6px 12px;
    background: #fff;
    border: 1px solid rgba(160,152,136,0.2);
    border-radius: 12px;
    font-size: 11px; color: #6B6058;
    cursor: pointer; transition: all 0.2s;
    white-space: nowrap;
  }
  .side-btn:hover { border-color: #C9A24B; color: #C9A24B; }

  /* ── Quick Buttons ─────────────── */
  .quick-row {
    display: flex; justify-content: space-between;
    padding: 12px 20px;
  }
  .quick-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 14px;
    background: #fff;
    border: 1px solid rgba(160,152,136,0.15);
    border-radius: 9999px;
    font-size: 12px; color: #6B6058;
    cursor: pointer; transition: all 0.2s;
  }
  .quick-btn:hover { border-color: #C9A24B; color: #C9A24B; }

  /* ── Action Bar ─────────────── */
  .action-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    background: #fff;
    border-top: 1px solid rgba(160,152,136,0.1);
  }
  .delete-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: #F5F0E8;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px;
    flex-shrink: 0;
  }
  .inspo-btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px;
    background: #F5F0E8;
    border: 1px solid rgba(160,152,136,0.15);
    border-radius: 12px;
    font-size: 13px; color: #6B6058;
    cursor: pointer; transition: all 0.2s;
  }
  .inspo-btn:hover { background: #EDE8E0; }
  .finish-btn {
    flex: 1.5;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 14px;
    background: linear-gradient(135deg, #A87F2E, #8B6A20);
    border: none; border-radius: 12px;
    font-size: 14px; font-weight: 600; color: #fff;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 2px 12px rgba(168,127,46,0.3);
  }
  .finish-btn:hover { transform: translateY(-1px); }

  /* ── Bead Selector ─────────────── */
  .bead-selector {
    flex: 1;
    background: #fff;
    border-top: 1px solid rgba(160,152,136,0.1);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .bead-handle {
    text-align: center;
    padding: 10px 0 6px;
    cursor: pointer;
  }
  .bead-handle .bar {
    width: 40px; height: 4px;
    background: rgba(160,152,136,0.3);
    border-radius: 2px;
    margin: 0 auto 4px;
  }
  .bead-handle .text { font-size: 12px; color: #A09888; }

  .bead-tabs {
    display: flex; gap: 0;
    padding: 0 16px;
    border-bottom: 1px solid rgba(160,152,136,0.1);
  }
  .bead-tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 14px; color: #A09888;
    cursor: pointer; transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }
  .bead-tab.active {
    color: #1A1410; font-weight: 600;
    border-bottom-color: #C9A24B;
  }

  .bead-grid-wrap {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .bead-sidebar {
    width: 60px;
    padding: 8px 0;
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(160,152,136,0.08);
    overflow-y: auto;
  }
  .bead-sidebar-item {
    padding: 8px 0;
    text-align: center;
    font-size: 11px; color: #A09888;
    cursor: pointer; transition: all 0.2s;
  }
  .bead-sidebar-item.active { color: #C9A24B; font-weight: 600; }

  .bead-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 12px;
    overflow-y: auto;
    max-height: 260px;
  }

  .bead-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 8px 4px;
    border-radius: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .bead-item:hover { background: rgba(201,162,75,0.08); }
  .bead-item .swatch {
    width: 40px; height: 40px;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  .bead-item .name {
    font-size: 11px; color: #6B6058;
    text-align: center; line-height: 1.3;
  }
  .bead-item .price {
    font-family: "Fira Code", monospace;
    font-size: 10px; color: #C9A24B;
  }

  .size-sidebar {
    width: 36px;
    padding: 8px 0;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    border-left: 1px solid rgba(160,152,136,0.08);
  }
  .size-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: none;
    border: 1px solid rgba(160,152,136,0.15);
    font-size: 10px; color: #A09888;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .size-btn.active { background: #1A1410; color: #fff; border-color: #1A1410; }

  /* ── 3D Preview Modal ─────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: none;
    align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    width: 90%; max-width: 400px;
    background: #1A1410;
    border-radius: 24px;
    overflow: hidden;
    animation: slide-up 0.3s ease;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(160,152,136,0.15);
  }
  .modal-header h3 { font-size: 16px; font-weight: 600; color: #FAF7F2; }
  .modal-close {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #A09888; font-size: 14px;
  }
  .modal-3d {
    height: 300px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .modal-3d .placeholder {
    text-align: center; color: #6B6058;
  }
  .modal-3d .placeholder .icon { font-size: 48px; margin-bottom: 12px; }
  .modal-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-top: 1px solid rgba(160,152,136,0.15);
  }
  .modal-footer .price { font-family: "Fira Code", monospace; font-size: 20px; font-weight: 700; color: #C9A24B; }
  .modal-footer .add-btn {
    padding: 12px 28px;
    background: linear-gradient(135deg, #C9A24B, #A87F2E);
    border: none; border-radius: 9999px;
    font-size: 14px; font-weight: 600; color: #fff;
    cursor: pointer;
  }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="page">
  <!-- ── Top Bar ── -->
  <div class="topbar">
    <a class="back" href="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 data-i18n="diy.title">Design Your Own Bracelet</h1>
    <div class="menu">···</div>
  </div>

  <!-- ── Stats Bar ── -->
  <div class="stats-bar">
    <div class="stat">
      <span data-i18n="diy.wrist_size">Wrist Size</span>
      <span class="val" id="wrist-size">15.5</span>
      <span class="unit">cm ▲</span>
    </div>
    <div class="stat">
      <span data-i18n="diy.bead_count">Beads</span>
      <span class="val" id="bead-count">0</span>
      <span class="unit" data-i18n="diy.bead_count">颗</span>
    </div>
    <div class="stat">
      <span data-i18n="diy.price">Price</span>
      <span class="val" id="total-price">$0</span>
    </div>
  </div>

  <!-- ── Fit Status ── -->
  <div class="fit-status" id="fit-status">
    Target 15.5cm — Add beads to see fit status
  </div>

  <!-- ── Plate Area ── -->
  <div class="plate-area">
    <div class="plate" id="plate">
      <div class="plate-watermark">紫宸石箓</div>
      <div class="plate-hint" id="plate-hint">— Start with one crystal —</div>
    </div>

    <div class="side-btns">
      <button class="side-btn" onclick="showToast('Design tools coming soon')">··· <span data-i18n="diy.tools">Tools</span></button>
      <button class="side-btn" onclick="showToast('Advanced matching coming soon')">✦ <span data-i18n="diy.advanced">Advanced</span></button>
    </div>
  </div>

  <!-- ── Quick Row ── -->
  <div class="quick-row">
    <button class="quick-btn" onclick="randomDesign()">◇ <span data-i18n="diy.view_inspo">Browse Inspiration</span></button>
    <button class="quick-btn" onclick="showToast('Birthday elements coming soon')">◇ <span data-i18n="diy.birthday_elements">Birthday Elements</span></button>
  </div>

  <!-- ── Action Bar ── -->
  <div class="action-bar">
    <button class="delete-btn" onclick="clearPlate()">🗑️</button>
    <button class="inspo-btn" onclick="randomDesign()">+ <span data-i18n="diy.random_inspo">Inspiration Box</span></button>
    <button class="finish-btn" onclick="showFinishModal()">
      <span data-i18n="diy.finish_design">Complete Design</span> →
    </button>
  </div>

  <!-- ── Bead Selector ── -->
  <div class="bead-selector">
    <div class="bead-handle">
      <div class="bar"></div>
      <div class="text" data-i18n="diy.bead_crystal">展开选珠</div>
    </div>

    <div class="bead-tabs">
      <div class="bead-tab active" data-cat="crystal" onclick="switchBeadTab(this)">💎 <span data-i18n="diy.bead_crystal">Crystals</span></div>
      <div class="bead-tab" data-cat="accessory" onclick="switchBeadTab(this)">⚙️ <span data-i18n="diy.bead_accessory">Accessories</span></div>
    </div>

    <div class="bead-grid-wrap">
      <div class="bead-sidebar" id="bead-sidebar"></div>
      <div class="bead-grid" id="bead-grid"></div>
      <div class="size-sidebar" id="size-sidebar"></div>
    </div>
  </div>
</div>

<!-- ── 3D Preview Modal ── -->
<div class="modal-overlay" id="modal-3d">
  <div class="modal">
    <div class="modal-header">
      <h3>3D Preview</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-3d">
      <div class="placeholder">
        <div class="icon">🔮</div>
        <div>3D rendering will appear here</div>
        <div style="font-size:12px;margin-top:8px;color:#6B6058">Three.js powered</div>
      </div>
    </div>
    <div class="modal-footer">
      <div class="price" id="modal-price">$0</div>
      <button class="add-btn" onclick="addToCartFromModal()" data-i18n="diy.add_to_cart">Add to Cart</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
  // ── State ──
  let selectedBeads = [];
  let currentBeadCat = 'crystal';
  let currentElement = 'all';
  let currentSize = 10;

  // ── Init ──
  function init() {
    renderSidebar();
    renderBeadGrid();
    renderSizeSidebar();
  }

  // ── Sidebar (Elements) ──
  function renderSidebar() {
    const sidebar = document.getElementById('bead-sidebar');
    const elements = ['all', 'metal', 'wood', 'water', 'fire', 'earth'];
    const labels = { all: 'All', metal: 'Metal', wood: 'Wood', water: 'Water', fire: 'Fire', earth: 'Earth' };
    sidebar.innerHTML = elements.map(el =>
      `<div class="bead-sidebar-item ${el === currentElement ? 'active' : ''}"
            onclick="currentElement='${el}';renderSidebar();renderBeadGrid()">${labels[el]}</div>`
    ).join('');
  }

  // ── Bead Grid ──
  function renderBeadGrid() {
    const grid = document.getElementById('bead-grid');
    let beads = BEADS.filter(b => b.cat === currentBeadCat);
    if (currentElement !== 'all') beads = beads.filter(b => b.element === currentElement);
    beads = beads.filter(b => b.size === currentSize || currentBeadCat === 'accessory');

    grid.innerHTML = beads.map(b => `
      <div class="bead-item" onclick="addBead('${b.id}')">
        <div class="swatch" style="background:${b.color}"></div>
        <div class="name">${I18n.lang === 'zh' ? b.name_zh : b.name_en}</div>
        <div class="price">$${b.price.toFixed(2)}</div>
      </div>
    `).join('');
  }

  // ── Size Sidebar ──
  function renderSizeSidebar() {
    const sidebar = document.getElementById('size-sidebar');
    const sizes = [6, 8, 10, 12, 14, 16];
    sidebar.innerHTML = sizes.map(s =>
      `<button class="size-btn ${s === currentSize ? 'active' : ''}"
              onclick="currentSize=${s};renderSizeSidebar();renderBeadGrid()">${s}</button>`
    ).join('');
  }

  // ── Tab Switch ──
  function switchBeadTab(el) {
    $$('.bead-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentBeadCat = el.dataset.cat;
    currentElement = 'all';
    renderSidebar();
    renderBeadGrid();
  }

  // ── Add Bead to Plate ──
  function addBead(id) {
    const bead = BEADS.find(b => b.id === id);
    if (!bead) return;
    selectedBeads.push(bead);
    updatePlate();
    showToast(`+ ${I18n.lang === 'zh' ? bead.name_zh : bead.name_en}`);
  }

  // ── Update Plate ──
  function updatePlate() {
    const plate = document.getElementById('plate');
    const hint = document.getElementById('plate-hint');

    // Remove old beads
    plate.querySelectorAll('.plate-bead').forEach(b => b.remove());

    if (selectedBeads.length === 0) {
      hint.style.display = 'block';
    } else {
      hint.style.display = 'none';
      const n = selectedBeads.length;
      const radius = 110;
      const centerX = 140;
      const centerY = 140;

      selectedBeads.forEach((bead, i) => {
        const angle = (2 * Math.PI * i / n) - Math.PI / 2;
        const x = centerX + radius * Math.cos(angle) - 14;
        const y = centerY + radius * Math.sin(angle) - 14;

        const el = document.createElement('div');
        el.className = 'plate-bead';
        el.style.cssText = `left:${x}px;top:${y}px;background:${bead.color}`;
        el.title = I18n.lang === 'zh' ? bead.name_zh : bead.name_en;
        el.onclick = () => { selectedBeads.splice(i, 1); updatePlate(); };
        plate.appendChild(el);
      });
    }

    // Update stats
    const total = selectedBeads.reduce((s, b) => s + b.price, 0);
    document.getElementById('bead-count').textContent = selectedBeads.length;
    document.getElementById('total-price').textContent = `$${total.toFixed(2)}`;

    const wristSize = 15.5;
    const circumference = wristSize * Math.PI;
    const beadTotal = selectedBeads.reduce((s, b) => s + b.size, 0);
    const fitStatus = document.getElementById('fit-status');
    if (selectedBeads.length === 0) {
      fitStatus.textContent = `Target ${wristSize}cm — Add beads to see fit status`;
    } else {
      const diff = Math.abs(beadTotal - circumference).toFixed(1);
      const fit = beadTotal >= circumference ? 'Over' : 'Under';
      fitStatus.textContent = `Current ~${(beadTotal / Math.PI).toFixed(1)}cm · ${fit} by ${diff}mm`;
    }
  }

  // ── Clear Plate ──
  function clearPlate() {
    selectedBeads = [];
    updatePlate();
  }

  // ── Random Design ──
  function randomDesign() {
    clearPlate();
    const n = 16 + Math.floor(Math.random() * 6);
    const crystalBeads = BEADS.filter(b => b.cat === 'crystal');
    for (let i = 0; i < n; i++) {
      selectedBeads.push(crystalBeads[Math.floor(Math.random() * crystalBeads.length)]);
    }
    updatePlate();
    showToast('Random design generated!');
  }

  // ── Finish Modal ──
  function showFinishModal() {
    if (selectedBeads.length === 0) {
      showToast('Add some beads first!');
      return;
    }
    const total = selectedBeads.reduce((s, b) => s + b.price, 0);
    document.getElementById('modal-price').textContent = `$${total.toFixed(2)}`;
    document.getElementById('modal-3d').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal-3d').classList.remove('active');
  }

  function addToCartFromModal() {
    const total = selectedBeads.reduce((s, b) => s + b.price, 0);
    Cart.add({
      id: 'diy-' + Date.now(),
      type: 'diy',
      name: `DIY Bracelet (${selectedBeads.length} beads)`,
      price: total,
      beads: selectedBeads.map(b => b.id),
      qty: 1,
    });
    closeModal();
    showToast('Added to cart!');
    updatePlate();
  }

  init();
  I18n.init();
</script>
</body>
</html>
