<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cart — Zichen-Runelith</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  body { background: #FAF7F2; color: #1A1410; }
  .page { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; justify-content: center;
    height: 56px; padding: 0 20px;
    background: rgba(250,247,242,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(160,152,136,0.12);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar .back { position: absolute; left: 16px; cursor: pointer; color: #1A1410; }
  .topbar h1 { font-size: 17px; font-weight: 600; }
  .topbar .clear {
    position: absolute; right: 16px;
    font-size: 13px; color: #A09888; cursor: pointer;
  }

  .content { flex: 1; padding: 20px; }

  .empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 50vh; text-align: center;
    color: #A09888;
  }
  .empty .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
  .empty h3 { font-size: 18px; font-weight: 600; color: #6B6058; margin-bottom: 8px; }
  .empty p { font-size: 14px; margin-bottom: 24px; }
  .empty .btn {
    padding: 12px 28px;
    background: linear-gradient(135deg, #C9A24B, #A87F2E);
    border: none; border-radius: 9999px;
    font-size: 14px; font-weight: 600; color: #fff;
    cursor: pointer;
  }

  .cart-item {
    display: flex; gap: 14px;
    padding: 16px;
    background: #fff;
    border: 1px solid rgba(160,152,136,0.1);
    border-radius: 16px;
    margin-bottom: 12px;
    align-items: center;
  }
  .cart-item .check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(160,152,136,0.3);
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .cart-item .check.checked {
    background: #C9A24B; border-color: #C9A24B;
  }
  .cart-item .check.checked::after {
    content: '✓'; color: #fff; font-size: 12px; font-weight: 700;
  }
  .cart-item .img {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #F5F0E8, #E8E0D0);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; flex-shrink: 0;
  }
  .cart-item .info { flex: 1; }
  .cart-item .info .name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .cart-item .info .meta { font-size: 12px; color: #A09888; margin-bottom: 8px; }
  .cart-item .info .price { font-family: "Fira Code", monospace; font-size: 16px; font-weight: 600; color: #C9A24B; }
  .cart-item .remove {
    font-size: 13px; color: #A09888; cursor: pointer;
    padding: 4px 8px;
  }
  .cart-item .remove:hover { color: #F0576B; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    background: rgba(250,247,242,0.96);
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(160,152,136,0.12);
    z-index: 50;
  }
  .bottom-bar .total {
    font-family: "Fira Code", monospace;
    font-size: 22px; font-weight: 700; color: #C9A24B;
  }
  .bottom-bar .checkout-btn {
    padding: 14px 32px;
    background: linear-gradient(135deg, #1A1410, #2A1F18);
    border: none; border-radius: 9999px;
    font-size: 14px; font-weight: 600; color: #fff;
    cursor: pointer; transition: all 0.2s;
  }
  .bottom-bar .checkout-btn:hover { transform: translateY(-1px); }

  .tab-spacer { height: 80px; }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <a class="back" href="javascript:history.back()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 data-i18n="cart.title">Shopping Cart</h1>
    <span class="clear" onclick="clearAll()" data-i18n="cart.clear_all">Clear All</span>
  </div>

  <div class="content" id="cart-content"></div>
  <div class="tab-spacer"></div>

  <div class="bottom-bar" id="bottom-bar" style="display:none">
    <div class="total" id="cart-total">$0</div>
    <button class="checkout-btn" onclick="location.href='checkout.html'" data-i18n="cart.checkout">Proceed to Checkout</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
  function renderCart() {
    const items = Cart.get();
    const content = document.getElementById('cart-content');
    const bar = document.getElementById('bottom-bar');

    if (items.length === 0) {
      content.innerHTML = `
        <div class="empty">
          <div class="icon">🛒</div>
          <h3 data-i18n="cart.empty">Your cart is empty</h3>
          <p data-i18n="cart.empty_desc">Discover something you love</p>
          <button class="btn" onclick="location.href='index.html'" data-i18n="home.start_journey">Begin Your Crystal Journey</button>
        </div>
      `;
      bar.style.display = 'none';
      return;
    }

    bar.style.display = 'flex';
    content.innerHTML = items.map((item, i) => `
      <div class="cart-item">
        <div class="check checked" onclick="this.classList.toggle('checked');updateTotal()"></div>
        <div class="img">${item.emoji || '💎'}</div>
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="meta">${item.type === 'diy' ? 'Custom Design' : `Size: ${item.size || 8}mm`}</div>
          <div class="price">$${(item.price * item.qty).toFixed(2)}</div>
        </div>
        <div class="remove" onclick="removeItem(${i})" data-i18n="cart.remove">Remove</div>
      </div>
    `).join('');

    updateTotal();
  }

  function removeItem(index) {
    const items = Cart.get();
    const item = items[index];
    Cart.remove(item.id, item.type);
    renderCart();
  }

  function clearAll() {
    Cart.clear();
    renderCart();
  }

  function updateTotal() {
    const items = Cart.get();
    const total = items.reduce((s, item) => s + item.price * item.qty, 0);
    document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
  }

  renderCart();
  I18n.init();
</script>
</body>
</html>
