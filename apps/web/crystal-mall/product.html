<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Product — Zichen-Runelith</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  body { background: #FAF7F2; color: #1A1410; }
  .page { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; justify-content: center;
    height: 56px; padding: 0 20px;
    background: rgba(250,247,242,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(160,152,136,0.12);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar .back { position: absolute; left: 16px; cursor: pointer; color: #1A1410; }
  .topbar h1 { font-size: 17px; font-weight: 600; }

  .hero-img {
    aspect-ratio: 1;
    background: linear-gradient(135deg, #F5F0E8, #E8E0D0);
    display: flex; align-items: center; justify-content: center;
    font-size: 100px;
    position: relative;
  }
  .hero-img .tag {
    position: absolute; top: 16px; left: 16px;
    padding: 6px 14px;
    background: rgba(201,162,75,0.15);
    border: 1px solid rgba(201,162,75,0.3);
    border-radius: 9999px;
    font-size: 12px; color: #C9A24B;
  }

  .info { padding: 24px 20px; }
  .info h2 { font-family: "PingFang SC", serif; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .info .price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .info .price { font-family: "Fira Code", monospace; font-size: 28px; font-weight: 700; color: #C9A24B; }
  .info .original { font-family: "Fira Code", monospace; font-size: 16px; color: #B9B6C9; text-decoration: line-through; }
  .info .badge { display: inline-flex; padding: 4px 12px; background: rgba(139,111,212,0.1); border-radius: 9999px; font-size: 12px; color: #8B6FD4; margin-bottom: 16px; }
  .info .desc { font-size: 14px; color: #6B6058; line-height: 1.7; margin-bottom: 24px; }

  .sizes { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .size-opt {
    padding: 8px 16px; border: 1px solid rgba(160,152,136,0.2); border-radius: 9999px;
    font-size: 13px; color: #6B6058; cursor: pointer; transition: all 0.2s;
  }
  .size-opt:hover, .size-opt.active { border-color: #C9A24B; color: #C9A24B; background: rgba(201,162,75,0.08); }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 12px;
    padding: 16px 20px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    background: rgba(250,247,242,0.96);
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(160,152,136,0.12);
    z-index: 50;
  }
  .btn-cart {
    flex: 1; padding: 14px;
    background: #fff; border: 1px solid rgba(160,152,136,0.2); border-radius: 14px;
    font-size: 14px; font-weight: 500; color: #1A1410;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-cart:hover { border-color: #C9A24B; }
  .btn-buy {
    flex: 1.5; padding: 14px;
    background: linear-gradient(135deg, #C9A24B, #A87F2E);
    border: none; border-radius: 14px;
    font-size: 14px; font-weight: 600; color: #fff;
    cursor: pointer; box-shadow: 0 2px 12px rgba(201,162,75,0.3);
  }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <a class="back" href="javascript:history.back()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 id="product-title">Product</h1>
  </div>

  <div class="hero-img" id="product-img">
    <span class="tag" id="product-tag"></span>
    <span id="product-emoji"></span>
  </div>

  <div class="info">
    <h2 id="product-name"></h2>
    <div class="price-row">
      <span class="price" id="product-price"></span>
      <span class="original" id="product-original"></span>
    </div>
    <div class="badge" data-i18n="product.free_shipping">Free Shipping</div>
    <div class="desc" id="product-desc"></div>
    <div class="sizes" id="product-sizes"></div>
  </div>

  <div style="height:80px"></div>

  <div class="bottom-bar">
    <button class="btn-cart" onclick="addProductToCart()" data-i18n="product.add_to_cart">Add to Cart</button>
    <button class="btn-buy" onclick="addProductToCart();location.href='cart.html'" data-i18n="product.buy_now">Buy Now</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script>
  let currentProduct = null;
  let selectedSize = null;

  function init() {
    const id = parseInt(getParam('id'));
    currentProduct = PRODUCTS.find(p => p.id === id);
    if (!currentProduct) { location.href = 'index.html'; return; }

    const p = currentProduct;
    document.getElementById('product-title').textContent = I18n.lang === 'zh' ? p.name_zh : p.name_en;
    document.getElementById('product-name').textContent = I18n.lang === 'zh' ? p.name_zh : p.name_en;
    document.getElementById('product-emoji').textContent = p.emoji;
    document.getElementById('product-tag').textContent = I18n.lang === 'zh' ? p.tag_zh : p.tag_en;
    document.getElementById('product-price').textContent = `$${p.price}`;
    document.getElementById('product-original').textContent = p.originalPrice ? `$${p.originalPrice}` : '';
    document.getElementById('product-desc').textContent = I18n.lang === 'zh' ? p.desc_zh : p.desc_en;

    const sizesEl = document.getElementById('product-sizes');
    (p.sizes || [8, 10]).forEach(s => {
      const btn = document.createElement('div');
      btn.className = 'size-opt';
      btn.textContent = `${s}mm`;
      btn.onclick = () => {
        $$('.size-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSize = s;
      };
      sizesEl.appendChild(btn);
    });
  }

  function addProductToCart() {
    if (!currentProduct) return;
    Cart.add({
      id: currentProduct.id,
      type: 'product',
      name: I18n.lang === 'zh' ? currentProduct.name_zh : currentProduct.name_en,
      price: currentProduct.price,
      emoji: currentProduct.emoji,
      size: selectedSize || currentProduct.sizes?.[0] || 8,
      qty: 1,
    });
    showToast('Added to cart!');
  }

  init();
  I18n.init();
</script>
</body>
</html>
