<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机壳预览 · 紫宸石箓</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  /* ═══════════════════════════════════════════════════════════════
     手机壳 · 可交互小程序模拟器
     .phone-case = 金属机身（边框/按键/圆角）
     .phone-screen = 屏幕玻璃（刘海/灵动岛 + 内容裁剪）
     .phone = 小程序页面容器（5 页：首页/GINA/定制/购物车/我的）
     ═══════════════════════════════════════════════════════════════ */

  :root {
    --case-a: #4a4a52;
    --case-b: #1a1a1e;
    --case-c: #0b0b0e;
    --screen-w: 375px;
    --screen-h: 812px;
  }

  body { background: #0e0d12; overflow: hidden; }

  /* ── 顶部工具栏 ─────────────────── */
  .toolbar {
    height: 54px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 20px;
    border-bottom: 1px solid rgba(160,152,136,0.15);
    background: rgba(26,20,16,0.7);
    backdrop-filter: blur(14px);
  }
  .toolbar .title { font-size: 14px; font-weight: 600; color: #FAF7F2; white-space: nowrap; }
  .toolbar .title small { color: #A09888; font-weight: 400; font-size: 12px; margin-left: 8px; }
  .toolbar .sep { width: 1px; height: 20px; background: rgba(160,152,136,0.2); }
  .toolbar .ctl { display: flex; align-items: center; gap: 8px; }
  .toolbar .ctl label { font-size: 12px; color: #A09888; white-space: nowrap; }
  .toolbar select {
    background: #26262e; color: #FAF7F2;
    border: 1px solid #3a3a46; border-radius: 8px;
    padding: 6px 10px; font-size: 12px; font-family: inherit; outline: none;
  }
  .toolbar select:focus { border-color: #C9A24B; }
  .toolbar .btn {
    background: #26262e; border: 1px solid #3a3a46; color: #FAF7F2;
    border-radius: 8px; padding: 6px 12px; font-size: 12px;
    cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.2s;
  }
  .toolbar .btn:hover { border-color: #C9A24B; }
  .toolbar .btn.active { background: linear-gradient(135deg, #C9A24B, #A87F2E); border-color: transparent; color: #fff; }

  /* ── 舞台 ─────────────────── */
  .stage {
    height: calc(100vh - 54px);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .stage::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(800px 500px at 30% 20%, rgba(139,111,212,0.12), transparent 60%),
      radial-gradient(700px 500px at 80% 80%, rgba(201,162,75,0.08), transparent 60%);
  }
  .stage-wrap { transform-origin: center; transition: transform 0.25s ease; position: relative; }

  /* ═══ 手机机身 ═══ */
  .phone-case {
    position: relative;
    padding: 12px;
    border-radius: 58px;
    background: linear-gradient(145deg, var(--case-a) 0%, var(--case-b) 40%, var(--case-c) 75%, var(--case-b) 100%);
    box-shadow:
      0 0 0 1.5px #000,
      0 0 0 4px var(--case-a),
      0 0 0 5px #060608,
      inset 0 0 0 1px rgba(255,255,255,0.06),
      0 40px 90px rgba(0,0,0,0.75),
      0 10px 30px rgba(0,0,0,0.5);
  }
  .phone-case::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 54px;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), transparent 22%, transparent 78%, rgba(0,0,0,0.25));
    pointer-events: none;
    z-index: 3;
  }

  .phone-case .key { position: absolute; background: linear-gradient(90deg, var(--case-a), var(--case-c)); border-radius: 3px; z-index: 4; }
  .phone-case .key.power  { right: -4px; top: 220px; width: 4px; height: 100px; }
  .phone-case .key.vol-up  { left: -4px; top: 160px; width: 4px; height: 64px; }
  .phone-case .key.vol-dn  { left: -4px; top: 234px; width: 4px; height: 64px; }
  .phone-case .key.mute    { left: -4px; top: 130px; width: 4px; height: 26px; }

  /* ═══ 屏幕玻璃 ═══ */
  .phone-screen {
    position: relative;
    width: var(--screen-w);
    height: var(--screen-h);
    border-radius: 46px;
    overflow: hidden;
    background: #000;
    z-index: 1;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }

  .phone-screen .cutout {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    background: #000;
    box-shadow: inset 0 0 0 1px #1a1a22;
  }
  .phone-screen.island .cutout { width: 118px; height: 34px; border-radius: 22px; }
  .phone-screen.island .cutout::after {
    content: '';
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    width: 11px; height: 11px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #2a2a3a 0%, #0a0a12 70%);
  }
  .phone-screen.notch .cutout { width: 88%; height: 38px; border-radius: 0 0 22px 22px; }
  .phone-screen.notch .cutout::after {
    content: '●  ●';
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    letter-spacing: 10px; color: #0d0d16; font-size: 10px;
  }
  .phone-screen .home-bar {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    width: 132px; height: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.9);
    z-index: 60;
  }
  .phone-screen::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,0.06) 0%, transparent 28%, transparent 82%, rgba(255,255,255,0.03) 100%);
    pointer-events: none;
    z-index: 59;
  }

  /* ═══ .phone 小程序页面 ═══ */
  .phone {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    background: #FAF7F2;
    color: #1A1410;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .phone::-webkit-scrollbar { display: none; }

  /* ── 通用小程序组件 ─────────────────── */
  .sec { padding: 0 16px; margin-top: 22px; }
  .sec-head { text-align: center; margin-bottom: 14px; }
  .sec-head .t { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .sec-head .s { font-size: 11px; color: #A09888; margin-top: 3px; }
  .chip {
    display: inline-flex; align-items: center;
    padding: 9px 16px; font-size: 12px; font-weight: 500;
    border-radius: 999px; background: #fff;
    border: 1px solid rgba(160,152,136,0.2);
    color: #1A1410; cursor: pointer; user-select: none;
    transition: all 0.15s;
  }
  .chip:active { transform: scale(0.96); }
  .chip.on { background: rgba(201,162,75,0.1); border-color: rgba(201,162,75,0.4); color: #A87F2E; }
  .btn-gold {
    display: flex; align-items: center; justify-content: center;
    height: 46px; border-radius: 999px;
    background: linear-gradient(135deg, #C9A24B, #A87F2E);
    color: #fff; font-size: 14px; font-weight: 600;
    box-shadow: 0 0 24px rgba(201,162,75,0.3);
    cursor: pointer; user-select: none; transition: all 0.15s;
  }
  .btn-gold:active { transform: scale(0.97); }
  .btn-line {
    display: flex; align-items: center; justify-content: center;
    height: 42px; border-radius: 999px;
    background: transparent; color: #A87F2E; font-size: 13px; font-weight: 500;
    border: 1px solid rgba(201,162,75,0.4); cursor: pointer; user-select: none;
  }
  .btn-line:active { transform: scale(0.97); }

  /* ── 底部 TabBar（绑定切页） ─────────────────── */
  .mph-tab {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-around;
    height: 58px; padding-bottom: 6px;
    background: rgba(250,247,242,0.96);
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(160,152,136,0.14);
    z-index: 50;
  }
  .mph-tab .t {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 9px; color: #A09888;
    cursor: pointer; user-select: none; transition: color 0.15s;
    flex: 1;
  }
  .mph-tab .t.on { color: #C9A24B; }
  .mph-tab .t i { font-size: 18px; font-style: normal; }

  /* ── 提示 ─────────────────── */
  .toast {
    position: absolute;
    top: 48%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(26,20,16,0.88);
    color: #FAF7F2; font-size: 13px;
    padding: 10px 18px; border-radius: 12px;
    opacity: 0; pointer-events: none;
    transition: all 0.25s ease; z-index: 70;
    max-width: 80%; text-align: center;
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ═══ 首页 ═══ */
  .mph-hero {
    position: relative; height: 300px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #1A1410 0%, #2A1F18 40%, #3A2A1A 100%);
    box-shadow: 0 10px 40px rgba(26,20,16,0.25);
  }
  .mph-hero .particles { position: absolute; inset: 0; }
  .mph-hero .particles i {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(201,162,75,0.45);
    animation: mph-float 6s ease-in infinite;
  }
  @keyframes mph-float {
    0% { opacity: 0; transform: translateY(0) scale(1); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-220px) scale(0); }
  }
  .mph-hero .cn { font-size: 40px; font-weight: 700; color: #FAF7F2; letter-spacing: 10px; text-shadow: 0 4px 30px rgba(201,162,75,0.35); }
  .mph-hero .en { font-size: 10px; letter-spacing: 6px; color: #A09888; margin-top: 6px; }
  .mph-hero .slogan { font-size: 20px; color: #E8D5A0; letter-spacing: 3px; margin-top: 18px; }
  .mph-hero .cta {
    margin-top: 20px; padding: 12px 34px;
    background: linear-gradient(135deg, #C9A24B, #A87F2E);
    color: #fff; font-size: 14px; font-weight: 600;
    border-radius: 999px; box-shadow: 0 0 30px rgba(201,162,75,0.35);
    cursor: pointer; user-select: none;
  }
  .mph-hero .cta:active { transform: scale(0.96); }

  .mph-cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .mph-cats .c {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 0; background: #fff; border-radius: 14px;
    border: 1px solid rgba(160,152,136,0.12);
    cursor: pointer; user-select: none; transition: all 0.15s;
  }
  .mph-cats .c:active { background: rgba(201,162,75,0.06); border-color: rgba(201,162,75,0.3); }
  .mph-cats .c i { font-size: 22px; font-style: normal; }
  .mph-cats .c span { font-size: 10px; color: #6B6058; }

  .mph-gina {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 16px; margin-top: 22px;
    background: linear-gradient(135deg, rgba(139,111,212,0.08), rgba(201,162,75,0.05));
    border: 1px solid rgba(139,111,212,0.18);
    border-radius: 18px; cursor: pointer; user-select: none;
  }
  .mph-gina:active { transform: scale(0.98); }
  .mph-gina .orb {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 35% 35%, #B8A4E8, #8B6FD4, #6B4FB8);
    box-shadow: 0 0 24px rgba(139,111,212,0.35);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .mph-gina .g-t { font-size: 15px; font-weight: 600; }
  .mph-gina .g-s { font-size: 11px; color: #6B6058; margin-top: 2px; }
  .mph-gina .g-a { margin-left: auto; color: #A09888; font-size: 16px; }

  .mph-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 14px; scrollbar-width: none; }
  .mph-scroll::-webkit-scrollbar { display: none; }
  .mph-card {
    flex-shrink: 0; width: 130px;
    background: #fff; border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(160,152,136,0.12);
    cursor: pointer; user-select: none; transition: all 0.15s;
  }
  .mph-card:active { transform: scale(0.97); }
  .mph-card .img { height: 110px; background: linear-gradient(135deg, #F5F0E8, #E8E0D0); display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .mph-card .info { padding: 9px 10px; }
  .mph-card .n { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mph-card .p { font-size: 13px; font-weight: 700; color: #C9A24B; margin-top: 4px; font-family: "Fira Code", monospace; }

  .mph-inspire {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; margin: 22px 16px 0;
    background: linear-gradient(135deg, rgba(201,162,75,0.08), rgba(139,111,212,0.05));
    border: 1px solid rgba(201,162,75,0.15);
    border-radius: 18px; cursor: pointer; user-select: none;
  }
  .mph-inspire:active { transform: scale(0.98); }
  .mph-inspire .l { font-size: 10px; letter-spacing: 3px; color: #C9A24B; }
  .mph-inspire .t { font-size: 15px; font-weight: 700; margin-top: 4px; }
  .mph-inspire .s { font-size: 11px; color: #6B6058; margin-top: 2px; }
  .mph-inspire .e { font-size: 30px; }

  /* ═══ GINA 页 ═══ */
  .gina-wrap { display: flex; flex-direction: column; min-height: 100%; padding-bottom: 150px; }
  .gina-welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 30px 20px; text-align: center; }
  .gina-orb {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #d4c8b0, #b8a890, #8a7a68);
    box-shadow: 0 16px 60px rgba(0,0,0,0.12), inset 0 8px 40px rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center; font-size: 56px;
    margin-bottom: 28px; position: relative;
    animation: gina-breathe 4s ease-in-out infinite;
  }
  .gina-orb::before {
    content: ''; position: absolute; top: 12%; left: 18%;
    width: 35%; height: 22%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.5), transparent);
    border-radius: 50%; transform: rotate(-25deg);
  }
  @keyframes gina-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .gina-greet { font-size: 26px; font-weight: 700; }
  .gina-greet b { color: #8B6FD4; }
  .gina-sub { font-size: 15px; color: #6B6058; margin-top: 10px; }
  .gina-desc { font-size: 12px; color: #A09888; margin-top: 12px; line-height: 1.7; }
  .gina-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 26px; }
  .gina-tags .chip { font-size: 12px; }
  .gina-input {
    position: absolute; left: 12px; right: 12px; bottom: 62px;
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid rgba(160,152,136,0.2);
    border-radius: 999px; padding: 6px 6px 6px 16px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
  }
  .gina-input input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 13px; font-family: inherit; color: #1A1410;
  }
  .gina-input input::placeholder { color: #B9B6C9; }
  .gina-send {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #A87F2E, #8B6A20);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer; user-select: none;
  }
  .gina-send:active { transform: scale(0.94); }
  .gina-chat { padding: 18px 16px 4px; }
  .gina-msg { display: flex; margin-bottom: 12px; }
  .gina-msg.me { justify-content: flex-end; }
  .gina-msg .b {
    max-width: 82%; padding: 11px 14px; font-size: 12.5px; line-height: 1.6;
    border-radius: 16px;
  }
  .gina-msg.me .b { background: linear-gradient(135deg, #8B6FD4, #6B4FB8); color: #fff; border-bottom-right-radius: 4px; }
  .gina-msg.ai .b { background: #fff; border: 1px solid rgba(160,152,136,0.12); border-bottom-left-radius: 4px; }
  .gina-disclaimer { font-size: 9px; color: #B9B6C9; margin-top: 14px; }

  /* ═══ DIY 页 ═══ */
  .diy-wrap { padding: 18px 16px 150px; }
  .diy-head { text-align: center; margin-bottom: 6px; }
  .diy-head .t { font-size: 18px; font-weight: 700; }
  .diy-head .s { font-size: 11px; color: #A09888; margin-top: 4px; }
  .diy-panel { margin-top: 16px; }
  .diy-plate {
    width: 240px; height: 240px; border-radius: 50%;
    margin: 0 auto; position: relative;
    background: radial-gradient(circle at 40% 40%, #f5f0e8, #e8e0d0, #d4ccc0);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12), inset 0 2px 8px rgba(255,255,255,0.6), inset 0 -2px 8px rgba(0,0,0,0.06);
  }
  .diy-plate::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 1px solid rgba(201,162,75,0.25); }
  .diy-bead { position: absolute; width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.25); transform: translate(-50%,-50%); z-index: 2; }
  .diy-stats { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; font-size: 12px; color: #6B6058; }
  .diy-stats b { color: #A87F2E; font-family: "Fira Code", monospace; font-size: 15px; }
  .diy-beads { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .diy-btns { display: flex; gap: 10px; margin-top: 16px; }
  .diy-btns .btn-line { flex: 1; }
  .diy-btns .btn-gold { flex: 2; }

  /* ═══ 购物车 ═══ */
  .cart-wrap { padding: 18px 16px 150px; }
  .cart-head { text-align: center; }
  .cart-head .t { font-size: 18px; font-weight: 700; }
  .cart-item {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border-radius: 16px; padding: 12px;
    border: 1px solid rgba(160,152,136,0.12); margin-top: 12px;
  }
  .cart-item .img { width: 56px; height: 56px; border-radius: 12px; background: linear-gradient(135deg, #F5F0E8, #E8E0D0); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
  .cart-item .info { flex: 1; min-width: 0; }
  .cart-item .n { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cart-item .p { font-size: 14px; font-weight: 700; color: #C9A24B; margin-top: 4px; font-family: "Fira Code", monospace; }
  .cart-item .qty { display: flex; align-items: center; gap: 10px; }
  .cart-item .qty button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(160,152,136,0.3); background: #fff; color: #1A1410; font-size: 14px; cursor: pointer; }
  .cart-item .qty span { font-size: 13px; min-width: 18px; text-align: center; }
  .cart-item .del { color: #B9B6C9; font-size: 16px; cursor: pointer; padding: 6px; }
  .cart-total {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px; padding: 14px 0; font-size: 13px; color: #6B6058;
    border-top: 1px dashed rgba(160,152,136,0.3);
  }
  .cart-total b { color: #A87F2E; font-family: "Fira Code", monospace; font-size: 20px; }
  .cart-empty { text-align: center; color: #B9B6C9; font-size: 13px; padding: 60px 0; }

  /* ═══ 我的 ═══ */
  .prof-wrap { padding: 18px 16px 150px; }
  .prof-user {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, #2A1F18, #1A1410);
    border-radius: 20px; padding: 20px 16px;
    color: #FAF7F2;
  }
  .prof-user .avatar { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #B8A4E8, #8B6FD4, #6B4FB8); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .prof-user .nm { font-size: 16px; font-weight: 700; }
  .prof-user .vl { font-size: 10px; color: #E8D5A0; margin-top: 4px; }
  .prof-items { margin-top: 14px; background: #fff; border-radius: 18px; border: 1px solid rgba(160,152,136,0.12); overflow: hidden; }
  .prof-item { display: flex; align-items: center; gap: 12px; padding: 15px 16px; font-size: 13px; border-bottom: 1px solid rgba(160,152,136,0.08); cursor: pointer; user-select: none; }
  .prof-item:last-child { border-bottom: none; }
  .prof-item:active { background: rgba(201,162,75,0.05); }
  .prof-item .ic { font-size: 18px; }
  .prof-item .a { margin-left: auto; color: #B9B6C9; }

  .hint {
    position: absolute; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px; color: #5c5c68; white-space: nowrap; z-index: 5;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <div class="title">手机壳预览<small>可交互小程序模拟器</small></div>
    <div class="sep"></div>
    <div class="ctl">
      <label>机型</label>
      <select id="deviceSel"></select>
    </div>
    <div class="ctl">
      <label>刘海</label>
      <button class="btn active" id="btnIsland">灵动岛</button>
      <button class="btn" id="btnNotch">经典刘海</button>
    </div>
    <div class="ctl">
      <label>机身</label>
      <button class="btn active" id="btnTitanium">钛黑</button>
      <button class="btn" id="btnGold">紫金</button>
    </div>
    <div class="sep"></div>
    <div class="ctl">
      <button class="btn active" data-zoom="auto">适应</button>
      <button class="btn" data-zoom="0.75">0.75x</button>
      <button class="btn" data-zoom="1">1x</button>
      <button class="btn" data-zoom="1.15">1.15x</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="stage-wrap" id="stageWrap">
      <div class="phone-case" id="phoneCase">
        <span class="key mute"></span>
        <span class="key vol-up"></span>
        <span class="key vol-dn"></span>
        <span class="key power"></span>

        <div class="phone-screen island" id="phoneScreen">
          <span class="cutout"></span>
          <div class="phone" id="phone"></div>
          <div class="toast" id="toast"></div>
          <span class="home-bar"></span>
        </div>
      </div>
    </div>
    <div class="hint">手机壳内可滚动 · TabBar 可切页 · 工具栏切机型/刘海/机身/缩放</div>
  </div>

<script>
  /* ════════════════════════════════ 数据 ════════════════════════════════ */
  const CATS = [
    ["💗", "异性缘多多"], ["🧧", "红包鼓鼓"], ["📈", "事业顺顺的"], ["🌿", "健康每一天"],
    ["🌙", "睡眠一整晚"], ["🛡️", "坏事滚远远"], ["🎓", "成绩好又好"], ["😍", "人见人爱"],
  ];
  const PRODS = [
    { id: 1, emoji: "💜", name: "紫水晶簇摆件", price: 128, tag: "镇宅" },
    { id: 2, emoji: "💗", name: "粉晶爱心手串", price: 88,  tag: "桃花" },
    { id: 3, emoji: "💛", name: "黄水晶聚宝盆", price: 168, tag: "招财" },
    { id: 4, emoji: "💙", name: "海蓝宝守护吊坠", price: 158, tag: "平安" },
  ];
  const BEADS = [
    ["💜", "紫水晶", 12], ["💗", "粉晶", 10], ["💛", "黄水晶", 18], ["💙", "海蓝宝", 16],
    ["🖤", "黑曜石", 20], ["🌙", "月光石", 8], ["🤎", "茶晶", 15], ["💚", "绿萤石", 13],
  ];

  const TAB_ICONS = ["🏠", "💎", "📿", "🛒", "👤"];
  const TAB_NAMES = ["首页", "GINA", "定制", "购物车", "我的"];
  let curTab = 0;

  const $phone = document.getElementById("phone");
  const $toast = document.getElementById("toast");
  let toastTimer = null;
  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove("show"), 1500);
  }

  /* ════════════════════════════════ 首页 ════════════════════════════════ */
  function renderHome() {
    $phone.innerHTML = `
      <div class="mph-hero">
        <div class="particles">
          <i style="left:18%;top:40%;animation-delay:0s"></i>
          <i style="left:62%;top:52%;animation-delay:1.5s"></i>
          <i style="left:80%;top:32%;animation-delay:3s"></i>
          <i style="left:40%;top:20%;animation-delay:2.2s"></i>
          <i style="left:25%;top:60%;animation-delay:4s"></i>
        </div>
        <div class="cn">紫宸石箓</div>
        <div class="en">ZICHEN · RUNELITH</div>
        <div class="slogan">山有灵，晶有光</div>
        <div class="cta" onclick="go('diy')">开启你的水晶之旅 →</div>
      </div>

      <div class="sec">
        <div class="sec-head">
          <div class="t">找到属于你的能量</div>
          <div class="s">按功效分类</div>
        </div>
        <div class="mph-cats">
          ${CATS.map((c) => `<div class="c" onclick="toast('${c[1]} · 商品区建设中')"><i>${c[0]}</i><span>${c[1]}</span></div>`).join("")}
        </div>
      </div>

      <div class="mph-gina" onclick="go('gina')">
        <div class="orb">💎</div>
        <div>
          <div class="g-t">问 GINA</div>
          <div class="g-s">告诉我你的愿望，找到合适的水晶</div>
        </div>
        <div class="g-a">›</div>
      </div>

      <div class="sec" style="margin-top:22px">
        <div class="sec-head"><div class="t">热门推荐</div></div>
      </div>
      <div class="mph-scroll">
        ${PRODS.map((p) => `
          <div class="mph-card" onclick="toast('${p.name} · ¥${p.price}（详情页待接入）')">
            <div class="img">${p.emoji}</div>
            <div class="info"><div class="n">${p.name}</div><div class="p">¥${p.price}</div></div>
          </div>`).join("")}
      </div>

      <div class="mph-inspire" onclick="toast('灵感广场 · 建设中 ✨')">
        <div>
          <div class="l">INSPIRATION</div>
          <div class="t">看见不同水晶的相遇</div>
          <div class="s">找到属于你的搭配</div>
        </div>
        <div class="e">✨</div>
      </div>
      <div style="height:64px"></div>
      ${tabBar()}
    `;
    $phone.scrollTop = 0;
  }

  /* ════════════════════════════════ GINA ════════════════════════════════ */
  const GINA_REPLIES = [
    [/异性|爱情|桃花|love/i, "粉晶+月光石是提升异性缘的最佳组合。粉晶打开心轮，月光石增强直觉。要我帮你设计一条爱情手串吗？💗"],
    [/财|rich|wealth/i, "黄水晶是「商人之石」，搭配虎眼石既有招财能量又稳根基。要我设计一条招财手串吗？🧧"],
    [/事业|工作|career/i, "青金石增强智慧与清晰度，红玛瑙提升自信与勇气——事业成功的强大组合。要我帮你设计吗？📈"],
    [/健康|health/i, "绿萤石助专注舒缓，海蓝宝安抚情绪。适合日常佩戴的平衡组合～🌿"],
    [/生日|birth/i, "告诉我你的出生日期，我会结合五行元素为你推荐专属搭配 🎂"],
    [/hi|hello|你好/i, "你好！我是 GINA，你的水晶伴侣 ✨ 想聊爱情、财富、事业还是健康？"],
    [/.*/, "这是一个美好的意图～现在对你最重要的是什么？爱情、财富、健康还是守护？"],
  ];
  function ginaReply(text) {
    for (const [re, ans] of GINA_REPLIES) if (re.test(text)) return ans;
  }

  function renderGina() {
    $phone.innerHTML = `
      <div class="gina-wrap">
        <div class="gina-welcome">
          <div class="gina-orb">💎</div>
          <div class="gina-greet">hi 你好，我是 <b>GINA</b></div>
          <div class="gina-sub">可以陪你选水晶的智能助手</div>
          <div class="gina-desc">根据你的需求，随心搭配珠串<br>美学方案清晰易懂，轻松选购下单</div>
          <div class="gina-tags" id="ginaTags">
            ${["💗 异性缘多多", "🧧 红包鼓鼓", "📈 事业顺顺利", "✨ 热门搭配"].map((t, i) =>
              `<span class="chip" data-t="${i}">${t}</span>`).join("")}
          </div>
          <div class="gina-disclaimer">智能助手生成 · 仅供参考</div>
        </div>
        <div class="gina-chat" id="ginaChat"></div>
        <div class="gina-input">
          <input id="ginaInp" placeholder="请告诉我你的想法...">
          <div class="gina-send" id="ginaSend">▶</div>
        </div>
      </div>
      ${tabBar()}
    `;
    $phone.scrollTop = 0;
    const QUICK = ["想找提升异性缘的水晶", "我想招财聚宝", "我需要事业顺利的水晶", "推荐最热门的设计"];
    document.getElementById("ginaTags").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (chip) { document.getElementById("ginaInp").value = QUICK[+chip.dataset.t]; ginaSend(); }
    });
    document.getElementById("ginaSend").addEventListener("click", ginaSend);
    document.getElementById("ginaInp").addEventListener("keydown", (e) => { if (e.key === "Enter") ginaSend(); });
  }

  function ginaSend() {
    const inp = document.getElementById("ginaInp");
    const text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    const chat = document.getElementById("ginaChat");
    const add = (cls, html) => {
      const d = document.createElement("div");
      d.className = "gina-msg " + cls;
      d.innerHTML = `<div class="b">${html}</div>`;
      chat.appendChild(d);
      $phone.scrollTop = $phone.scrollHeight;
    };
    add("me", text.replace(/</g, "&lt;"));
    setTimeout(() => {
      add("ai", ginaReply(text));
      $phone.scrollTop = $phone.scrollHeight;
    }, 600);
  }

  /* ════════════════════════════════ DIY ════════════════════════════════ */
  let diyBeads = [];
  const BEAD_COLORS = ["#8E5AC8", "#F0A6C8", "#E0B364", "#7FB8F0", "#3a3a44", "#B8B8D8", "#8a6a48", "#8FD8B4"];

  function renderDiy() {
    $phone.innerHTML = `
      <div class="diy-wrap">
        <div class="diy-head">
          <div class="t">DIY 手串定制</div>
          <div class="s">点选珠子排入圆盘，自由搭配</div>
        </div>

        <div class="diy-panel">
          <div class="diy-plate" id="diyPlate"></div>
          <div class="diy-stats">已选 <b id="diyCount">0</b> 颗 · 合计 <b id="diyPrice">¥0</b></div>
        </div>

        <div class="sec-head" style="margin-top:20px"><div class="t">选珠子</div></div>
        <div class="diy-beads" id="diyBeads">
          ${BEADS.map((b, i) => `<span class="chip" data-i="${i}">${b[0]} ${b[1]} · ¥${b[2]}</span>`).join("")}
        </div>

        <div class="diy-btns">
          <div class="btn-line" onclick="diyUndo()">撤销</div>
          <div class="btn-line" onclick="diyClear()">清空</div>
          <div class="btn-gold" onclick="toast('下一步 · 选择手围尺寸 →')">下一步</div>
        </div>
      </div>
      ${tabBar()}
    `;
    $phone.scrollTop = 0;
    document.getElementById("diyBeads").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (chip) addBead(+chip.dataset.i);
    });
    paintPlate();
  }

  function paintPlate() {
    const plate = document.getElementById("diyPlate");
    if (!plate) return;
    plate.querySelectorAll(".diy-bead").forEach((b) => b.remove());
    const cx = 120, cy = 120, r = 86;
    diyBeads.forEach((id, i) => {
      const a = -90 + (360 / Math.max(diyBeads.length, 1)) * i;
      const b = document.createElement("div");
      b.className = "diy-bead";
      b.style.left = (cx + r * Math.cos(a * Math.PI / 180)) + "px";
      b.style.top = (cy + r * Math.sin(a * Math.PI / 180)) + "px";
      b.style.background = BEAD_COLORS[id];
      b.title = BEADS[id][1];
      plate.appendChild(b);
    });
    const c = document.getElementById("diyCount"), p = document.getElementById("diyPrice");
    if (c) c.textContent = diyBeads.length;
    if (p) p.textContent = "¥" + diyBeads.reduce((s, id) => s + BEADS[id][2], 0);
  }

  function addBead(id) {
    if (diyBeads.length >= 16) return toast("最多 16 颗手串珠");
    diyBeads.push(id);
    paintPlate();
  }
  function diyUndo() { diyBeads.pop(); paintPlate(); }
  function diyClear() { diyBeads = []; paintPlate(); }

  /* ════════════════════════════════ 购物车 ════════════════════════════════ */
  let cart = PRODS.map((p) => ({ ...p, qty: 1 }));

  function renderCart() {
    $phone.innerHTML = `
      <div class="cart-wrap">
        <div class="cart-head"><div class="t">购物车</div></div>
        <div id="cartList"></div>
        <div class="cart-total">合计 <b id="cartTotal">¥0</b></div>
        <div class="btn-gold" onclick="toast('结算 · 收银台建设中 💳')">去结算</div>
      </div>
      ${tabBar()}
    `;
    $phone.scrollTop = 0;
    paintCart();
  }

  function paintCart() {
    const list = document.getElementById("cartList");
    const totalEl = document.getElementById("cartTotal");
    if (!list) return;
    if (!cart.length) {
      list.innerHTML = `<div class="cart-empty">购物车还是空的 🛒<br>去挑几颗喜欢的珠子吧</div>`;
      if (totalEl) totalEl.textContent = "¥0";
      return;
    }
    list.innerHTML = cart.map((c, i) => `
      <div class="cart-item">
        <div class="img">${c.emoji}</div>
        <div class="info">
          <div class="n">${c.name}</div>
          <div class="p">¥${c.price}</div>
        </div>
        <div class="qty">
          <button onclick="cartQty(${i},-1)">−</button>
          <span>${c.qty}</span>
          <button onclick="cartQty(${i},1)">+</button>
        </div>
        <div class="del" onclick="cartDel(${i})">✕</div>
      </div>`).join("");
    if (totalEl) totalEl.textContent = "¥" + cart.reduce((s, c) => s + c.price * c.qty, 0);
  }

  function cartQty(i, d) {
    cart[i].qty = Math.max(1, cart[i].qty + d);
    paintCart();
  }
  function cartDel(i) { cart.splice(i, 1); paintCart(); }

  /* ════════════════════════════════ 我的 ════════════════════════════════ */
  const PROFILE_MENU = [
    ["📦", "我的订单"], ["🎟️", "优惠券"], ["📍", "收货地址"], ["🔔", "消息通知"], ["⚙️", "设置"], ["ℹ️", "关于紫宸石箓"],
  ];
  function renderProfile() {
    $phone.innerHTML = `
      <div class="prof-wrap">
        <div class="prof-user">
          <div class="avatar">锦</div>
          <div>
            <div class="nm">锦鲤星人</div>
            <div class="vl">Lv.2 · 水晶探索者 · 已绑定微信</div>
          </div>
        </div>
        <div class="prof-items">
          ${PROFILE_MENU.map((m) => `<div class="prof-item" onclick="toast('${m[1]} · 建设中')"><span class="ic">${m[0]}</span>${m[1]}<span class="a">›</span></div>`).join("")}
        </div>
      </div>
      ${tabBar()}
    `;
    $phone.scrollTop = 0;
  }

  /* ════════════════════════════════ TabBar ════════════════════════════════ */
  function tabBar() {
    return `<div class="mph-tab">${TAB_NAMES.map((n, i) =>
      `<div class="t ${i === curTab ? "on" : ""}" onclick="go(${i})"><i>${TAB_ICONS[i]}</i>${n}</div>`).join("")}</div>`;
  }

  function go(i) {
    if (typeof i === "string") i = { diy: 2, gina: 1 }[i] ?? 0;
    curTab = i;
    [renderHome, renderGina, renderDiy, renderCart, renderProfile][i]();
  }

  /* ════════════════════════════════ 外壳控制 ════════════════════════════════ */
  const DEVICES = [
    { name: "iPhone 15 Pro",     w: 375, h: 812 },
    { name: "iPhone 15 Pro Max", w: 430, h: 932 },
    { name: "iPhone 16 Pro",     w: 402, h: 874 },
    { name: "iPhone 16 Pro Max", w: 440, h: 956 },
    { name: "折叠（竖屏）",      w: 412, h: 915 },
  ];
  const sel = document.getElementById("deviceSel");
  sel.innerHTML = DEVICES.map((d, i) => `<option value="${i}">${d.name}</option>`).join("");
  const root = document.documentElement;
  const stage = document.getElementById("stage");
  const wrap = document.getElementById("stageWrap");
  let zoomMode = "auto";

  function applyDevice(i) {
    const d = DEVICES[i];
    root.style.setProperty("--screen-w", d.w + "px");
    root.style.setProperty("--screen-h", d.h + "px");
    fit(d);
  }
  function fit(d) {
    if (zoomMode !== "auto") return;
    const availW = stage.clientWidth - 60;
    const availH = stage.clientHeight - 60;
    wrap.style.transform = "scale(" + Math.min(availW / (d.w + 34), availH / (d.h + 34), 1.4) + ")";
  }
  sel.addEventListener("change", () => applyDevice(Number(sel.value)));
  window.addEventListener("resize", () => fit(DEVICES[Number(sel.value)]));

  const screen = document.getElementById("phoneScreen");
  const btnIsland = document.getElementById("btnIsland");
  const btnNotch = document.getElementById("btnNotch");
  btnIsland.addEventListener("click", () => {
    screen.classList.remove("notch"); screen.classList.add("island");
    btnIsland.classList.add("active"); btnNotch.classList.remove("active");
  });
  btnNotch.addEventListener("click", () => {
    screen.classList.remove("island"); screen.classList.add("notch");
    btnNotch.classList.add("active"); btnIsland.classList.remove("active");
  });
  const btnTi = document.getElementById("btnTitanium");
  const btnGold = document.getElementById("btnGold");
  btnTi.addEventListener("click", () => {
    root.style.setProperty("--case-a", "#4a4a52");
    root.style.setProperty("--case-b", "#1a1a1e");
    root.style.setProperty("--case-c", "#0b0b0e");
    btnTi.classList.add("active"); btnGold.classList.remove("active");
  });
  btnGold.addEventListener("click", () => {
    root.style.setProperty("--case-a", "#6d5a3a");
    root.style.setProperty("--case-b", "#3a2c1a");
    root.style.setProperty("--case-c", "#1d150c");
    btnGold.classList.add("active"); btnTi.classList.remove("active");
  });
  document.querySelectorAll("[data-zoom]").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("[data-zoom]").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      zoomMode = b.dataset.zoom;
      if (zoomMode === "auto") fit(DEVICES[Number(sel.value)]);
      else wrap.style.transform = "scale(" + zoomMode + ")";
    });
  });

  applyDevice(0);
  renderHome();
</script>
</body>
</html>
