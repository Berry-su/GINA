<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gina 全息驾驶舱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #010304; overflow: hidden; }

  /* 能量核心全屏背景 */
  #sceneCore { position: fixed; inset: 0; display: block; z-index: 0; }

  /* HUD 栅格容器：三栏布局 */
  #hud {
    position: fixed; inset: 0; z-index: 4;
    display: grid;
    grid-template-columns: 21vw 1fr 21vw;
    grid-template-rows: 64px 1fr;
    gap: 18px;
    padding: 18px;
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }

  /* 顶部标题栏 */
  #topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
  }
  .top-title {
    font: 500 22px/1 'Orbitron', sans-serif; letter-spacing: 0.28em; color: #dcefff;
    text-shadow: 0 0 12px rgba(140,200,255,0.5);
  }
  .top-title small { font-size: 10px; letter-spacing: 0.3em; color: rgba(140,190,240,0.55); margin-left: 10px; font-weight: 300; }
  #clock { font: 300 20px/1 'Orbitron', sans-serif; letter-spacing: 0.2em; color: #fff; text-shadow: 0 0 8px rgba(170,225,255,0.55); }

  /* 左右栏 */
  #leftCol { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  #rightCol { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  #centerCol { position: relative; min-height: 0; }

  /* 通用面板 */
  .panel {
    background: rgba(7,16,32,0.62);
    border: 1px solid rgba(110,160,225,0.22);
    border-radius: 10px;
    font-family: 'Orbitron','Avenir Next','PingFang SC',sans-serif;
    backdrop-filter: blur(3px);
    overflow: hidden;
  }
  .panel-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 8px;
    font-size: 10px; letter-spacing: 0.22em; color: rgba(140,185,240,0.78);
    border-bottom: 1px solid rgba(110,160,225,0.12);
  }
  .panel-title::before { content: ''; width: 4px; height: 4px; background: rgba(120,200,255,0.8); border-radius: 50%; box-shadow: 0 0 6px rgba(120,200,255,0.7); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; padding: 5px 14px; }
  .row span { color: rgba(125,165,220,0.62); font-size: 11px; }
  .row b { color: rgba(185,218,250,0.95); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 13px; }

  /* 大脑框 */
  #brainPanel { position: relative; flex: 1.4; min-height: 0; background: radial-gradient(ellipse at 50% 46%, rgba(26,54,96,0.45), rgba(7,16,32,0.7) 78%); }
  #brainPanel::before { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; background-image: linear-gradient(rgba(120,165,225,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(120,165,225,0.05) 1px, transparent 1px); background-size: 34px 34px; }
  #sceneBrain { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .region { position: absolute; z-index: 3; pointer-events: none; font-family: 'Avenir Next',sans-serif; white-space: nowrap; }
  .region .rname { display: inline; font-size: 9px; letter-spacing: 0.06em; color: rgba(130,170,230,0.72); margin-right: 5px; }
  .region .rval { display: inline; font-size: 11px; color: rgba(185,225,255,0.92); font-variant-numeric: tabular-nums; }
  #rFrontal { left: 12px; top: 34px; }
  #rParietal { left: 12px; top: 52px; }
  #rOccipital { left: 12px; top: 70px; }
  #rTemporalL { left: 12px; top: 88px; }
  #rCerebellum { right: 12px; top: 34px; text-align: right; }
  #rBrainstem { right: 12px; top: 52px; text-align: right; }
  #rTemporalR { right: 12px; top: 70px; text-align: right; }

  /* 意识显示器 */
  #consciousness { flex: 1; min-height: 0; }
  #eegCanvas { width: 100%; height: 52px; display: block; opacity: 0.92; }
  .waves-label { display: flex; gap: 10px; margin: 2px 14px 8px; font-size: 8.5px; color: rgba(140,180,235,0.65); }
  .waves-label i { font-style: normal; }
  .waves-label i.on { color: rgba(195,228,255,0.95); text-shadow: 0 0 6px rgba(150,200,255,0.6); }

  .hot-item { font-size: 11.5px; padding: 4px 14px; color: rgba(170,205,245,0.88); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hot-item b { color: rgba(120,160,220,0.55); font-weight: 400; margin-right: 8px; font-size: 10px; }
  #klineCanvas { width: 100%; height: 140px; display: block; margin: 6px 0 10px; }

  /* 底部对话框（中央栏底部） */
  #chatBar { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); width: min(620px, 90%); font-family: 'Avenir Next','PingFang SC',sans-serif; }
  #reply { margin: 0 auto 8px; padding: 9px 14px; background: rgba(7,16,32,0.7); border-radius: 8px; font-size: 13px; color: rgba(200,225,250,0.92); opacity: 0; transition: opacity .25s; }
  #reply.show { opacity: 1; }
  .composer { display: flex; align-items: center; gap: 8px; background: rgba(7,16,32,0.7); border-radius: 8px; padding: 9px 12px; }
  #chatInput { flex: 1; background: transparent; border: none; outline: none; color: rgba(200,225,250,0.95); font: 14px/1.4 'Avenir Next','PingFang SC',sans-serif; }
  #chatInput::placeholder { color: rgba(150,190,240,0.35); }
  .icon-btn { flex: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: rgba(150,190,240,0.08); border: none; border-radius: 8px; color: rgba(150,190,240,0.6); cursor: pointer; }
  .icon-btn:hover { color: rgba(190,225,255,0.9); }
  .icon-btn.rec { color: #ff6b7a; animation: recPulse 1.1s infinite; }
  @keyframes recPulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .send-btn { flex: none; height: 34px; padding: 0 16px; background: rgba(150,190,240,0.08); border: none; border-radius: 8px; color: rgba(200,225,250,0.9); font: 11px 'Orbitron',sans-serif; letter-spacing: 0.18em; cursor: pointer; }
  .send-btn:hover { background: rgba(120,170,230,0.18); }
</style>
</head>
<body>
<canvas id="sceneCore"></canvas>

<div id="hud">
  <header id="topbar">
    <div class="top-title">GINA<small>HOLOGRAPHIC COCKPIT</small></div>
    <div id="clock">00:00:00</div>
  </header>

  <aside id="leftCol">
    <div class="panel" id="brainPanel">
      <canvas id="sceneBrain"></canvas>
      <div class="region" id="rFrontal"><div class="rname">额叶</div><div class="rval" id="vFrontal">--</div></div>
      <div class="region" id="rParietal"><div class="rname">顶叶</div><div class="rval" id="vParietal">--</div></div>
      <div class="region" id="rOccipital"><div class="rname">枕叶</div><div class="rval" id="vOccipital">--</div></div>
      <div class="region" id="rTemporalL"><div class="rname">颞叶L</div><div class="rval" id="vTemporalL">--</div></div>
      <div class="region" id="rCerebellum"><div class="rname">小脑</div><div class="rval" id="vCerebellum">--</div></div>
      <div class="region" id="rBrainstem"><div class="rname">脑干</div><div class="rval" id="vBrainstem">--</div></div>
      <div class="region" id="rTemporalR"><div class="rname">颞叶R</div><div class="rval" id="vTemporalR">--</div></div>
    </div>

    <div class="panel" id="consciousness">
      <div class="panel-title">意识显示器 CONSCIOUSNESS</div>
      <div class="row"><span>意识状态</span><b id="cState">清醒</b></div>
      <div class="row"><span>当前焦点</span><b id="cFocus">待命</b></div>
      <div class="row"><span>认知负荷</span><b id="cLoad">--</b></div>
      <div class="row"><span>情绪倾向</span><b id="cEmotion">平稳</b></div>
      <div class="row"><span>自主性</span><b id="cAuto">72%</b></div>
      <div class="panel-title" style="border-top:1px solid rgba(110,160,225,0.12);">实时脑电波 EEG</div>
      <canvas id="eegCanvas"></canvas>
      <div class="waves-label" id="wavesLabel"></div>
    </div>
  </aside>

  <main id="centerCol">
    <div id="chatBar">
      <div id="reply"></div>
      <div class="composer">
        <button class="icon-btn" id="voiceBtn" title="语音输入"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <input id="chatInput" placeholder="输入消息…" />
        <button class="send-btn" id="sendBtn">SEND</button>
      </div>
    </div>
  </main>

  <aside id="rightCol">
    <div class="panel" id="sysStatus">
      <div class="panel-title">系统状态 SYSTEM</div>
      <div class="row"><span>网络状态</span><b id="sNet">ONLINE</b></div>
      <div class="row"><span>网络延迟</span><b id="sLatency">--</b></div>
      <div class="row"><span>CPU 占用</span><b id="sCpu">--</b></div>
      <div class="row"><span>内存占用</span><b id="sMem">--</b></div>
      <div class="row"><span>核心温度</span><b id="sTemp">--</b></div>
    </div>

    <div class="panel" id="hotspots" style="flex:1.2;">
      <div class="panel-title">全国热点话题 TRENDING</div>
      <div id="hotList"></div>
    </div>

    <div class="panel" id="klinePanel">
      <div class="panel-title">大盘 K 线 INDEX</div>
      <canvas id="klineCanvas"></canvas>
    </div>
  </aside>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeGlowTextureCore() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(190,255,245,0.9)'); g.addColorStop(0.25,'rgba(120,230,220,0.35)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128); return new THREE.CanvasTexture(c);
}

// ============ 中央能量核心 ============
function initEnergyCore() {
  const canvas = document.getElementById('sceneCore');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setClearColor(0x010304, 1);
  const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x010304, 0.012);
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100); camera.position.set(0,0,8);
  const CORE_COLOR = new THREE.Color(0x3fd6c8), EDGE_COLOR = new THREE.Color(0xa8f0ff);

  const coreGeo = new THREE.IcosahedronGeometry(1.6, 4);
  const coreMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.FrontSide,
    uniforms: { uTime:{value:0}, uColor:{value:CORE_COLOR}, uEdge:{value:EDGE_COLOR} },
    vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.0); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying vec3 vN; varying vec3 vV; uniform float uTime; uniform vec3 uColor; uniform vec3 uEdge; void main(){ float fresnel=pow(1.0-abs(dot(normalize(vN),normalize(vV))),2.5); float s1=sin(gl_FragCoord.y*0.06+uTime*3.0)*0.5+0.5; float s2=sin(gl_FragCoord.x*0.05-uTime*2.0)*0.5+0.5; float energy=(s1+s2)*0.5; float alpha=0.12+fresnel*0.7+energy*0.22; vec3 col=mix(uColor,uEdge,fresnel); col+=fresnel*0.5+energy*0.25; gl_FragColor=vec4(col,clamp(alpha,0.0,1.0)); }`,
  });
  const core = new THREE.Mesh(coreGeo, coreMat); scene.add(core);

  const innerGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTextureCore(), color:0xd8fff6, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:0.7 }));
  innerGlow.scale.set(2.55,2.55,1); core.add(innerGlow);

  const N = 11000, positions = new Float32Array(N*3), golden = Math.PI*(3-Math.sqrt(5));
  for (let i=0;i<N;i++){ const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), th=golden*i, jr=1+(Math.random()-0.5)*0.12; positions[i*3]=Math.cos(th)*r*1.58*jr; positions[i*3+1]=y*1.58*jr; positions[i*3+2]=Math.sin(th)*r*1.58*jr; }
  const dotGeo = new THREE.BufferGeometry(); dotGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const dots = new THREE.Points(dotGeo, new THREE.PointsMaterial({ color:0xa8f0ff, size:0.03, transparent:true, opacity:0.5, depthWrite:false, blending:THREE.AdditiveBlending })); core.add(dots);

  const crossRingMat = new THREE.MeshBasicMaterial({ color:0xc0f0ff, transparent:true, opacity:0.35, depthWrite:false, blending:THREE.AdditiveBlending });
  const gm1 = new THREE.MeshBasicMaterial({ color:0xc0f0ff, transparent:true, opacity:0.1, depthWrite:false, blending:THREE.AdditiveBlending });
  const gm2 = new THREE.MeshBasicMaterial({ color:0xc0f0ff, transparent:true, opacity:0.05, depthWrite:false, blending:THREE.AdditiveBlending });
  const gm3 = new THREE.MeshBasicMaterial({ color:0xc0f0ff, transparent:true, opacity:0.02, depthWrite:false, blending:THREE.AdditiveBlending });
  const ringGroupH = new THREE.Group(); ringGroupH.rotation.x = Math.PI/2;
  const ringGroupV = new THREE.Group(); ringGroupV.rotation.y = Math.PI/2;
  for (let i=0;i<7;i++){ const r=1.9+i*0.04;
    ringGroupH.add(new THREE.Mesh(new THREE.TorusGeometry(r,0.015,8,200),gm1)); ringGroupH.add(new THREE.Mesh(new THREE.TorusGeometry(r,0.04,8,200),gm2)); ringGroupH.add(new THREE.Mesh(new THREE.TorusGeometry(r,0.08,8,200),gm3)); ringGroupH.add(new THREE.Mesh(new THREE.TorusGeometry(r,0.004,8,200),crossRingMat));
    ringGroupV.add(new THREE.Mesh(new THREE.TorusGeometry(r,0.015,8,200),gm1)); ringGroupV.add(new THREE.Mesh(new THREE.TorusGeometry(r,0.04,8,200),gm2)); ringGroupV.add(new THREE.Mesh(new THREE.TorusGeometry(r,0.08,8,200),gm3)); ringGroupV.add(new THREE.Mesh(new THREE.TorusGeometry(r,0.004,8,200),crossRingMat));
  }
  const crossRing = new THREE.Group(); crossRing.add(ringGroupH); crossRing.add(ringGroupV); crossRing.rotation.z=0.5; scene.add(crossRing);

  const wireIcosa = new THREE.IcosahedronGeometry(3.8,3);
  const wireMeshMat = new LineMaterial({ color:0xc8e8f0, transparent:true, opacity:0.25, depthWrite:false, blending:THREE.AdditiveBlending, linewidth:1.0 });
  wireMeshMat.resolution.set(window.innerWidth, window.innerHeight);
  const wireMeshGeo = new LineSegmentsGeometry(); wireMeshGeo.setPositions(new THREE.WireframeGeometry(wireIcosa).attributes.position.array);
  const wireMesh = new Line2(wireMeshGeo, wireMeshMat); wireMesh.computeLineDistances(); core.add(wireMesh);

  const orbitMat = new THREE.MeshBasicMaterial({ color:0xa0d8e8, transparent:true, opacity:0.35, depthWrite:false, blending:THREE.AdditiveBlending });
  const SAT_TRAIL = 14;
  const satOrbits = [ {r:4.2,rx:Math.PI/2,speed:0.5,angle:0},{r:4.9,rx:Math.PI/2+0.6,speed:-0.38,angle:Math.PI},{r:5.6,rx:Math.PI/2-0.6,speed:0.3,angle:Math.PI/2} ];
  const satMat = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`attribute float aTrail; varying float vTrail; void main(){ vTrail=aTrail; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=(1.0-vTrail)*30.0+7.0; gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying float vTrail; void main(){ float d=length(gl_PointCoord-vec2(0.5)); if(d>0.5) discard; float f=1.0-smoothstep(0.0,0.5,d); gl_FragColor=vec4(vec3(0.82,0.92,1.0),(1.0-vTrail)*f); }` });
  const satRingGroup = new THREE.Group(); satRingGroup.rotation.z=0.5; scene.add(satRingGroup);
  for (let o=0;o<satOrbits.length;o++){ const so=satOrbits[o], g=new THREE.Group(); g.rotation.x=so.rx; satRingGroup.add(g);
    const orbitMesh = new THREE.Mesh(new THREE.TorusGeometry(so.r,0.006,8,200), orbitMat); orbitMesh.rotation.x=Math.PI/2; g.add(orbitMesh);
    const pos = new Float32Array(SAT_TRAIL*3), trail = new Float32Array(SAT_TRAIL);
    for (let k=0;k<SAT_TRAIL;k++) trail[k]=k/(SAT_TRAIL-1);
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3)); geo.setAttribute('aTrail',new THREE.BufferAttribute(trail,1));
    const pts = new THREE.Points(geo, satMat); g.add(pts); so.pos=pos; so.pts=pts;
  }

  const METEORS = 80, TRAIL = 12, trailTotal = METEORS*TRAIL, tPos = new Float32Array(trailTotal*3), tTrail = new Float32Array(trailTotal), meteors = [];
  for (let m=0;m<METEORS;m++){ meteors.push({ x:(Math.random()-0.5)*20, z:(Math.random()-0.5)*20, y:-4+Math.random()*4, speed:0.02+Math.random()*0.04 }); for (let k=0;k<TRAIL;k++) tTrail[m*TRAIL+k]=k/(TRAIL-1); }
  const tGeo = new THREE.BufferGeometry(); tGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3)); tGeo.setAttribute('aTrail',new THREE.BufferAttribute(tTrail,1));
  const tMat = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`attribute float aTrail; varying float vTrail; void main(){ vTrail=aTrail; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=(1.0-vTrail)*5.0+1.5; gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying float vTrail; void main(){ float d=length(gl_PointCoord-vec2(0.5)); if(d>0.5) discard; float f=1.0-smoothstep(0.0,0.5,d); gl_FragColor=vec4(vec3(1.0),(1.0-vTrail)*0.85*f); }` });
  const particles = new THREE.Points(tGeo, tMat); scene.add(particles);

  const GCOLS = 160, GROWS = 160, groundTotal = GCOLS*GROWS, gPos = new Float32Array(groundTotal*3);
  const groundGeo = new THREE.BufferGeometry(); groundGeo.setAttribute('position',new THREE.BufferAttribute(gPos,3));
  const ground = new THREE.Points(groundGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.09, map:makeGlowTextureCore(), transparent:true, opacity:0.4, depthWrite:false, blending:THREE.AdditiveBlending }));
  ground.position.y = -4.0; scene.add(ground);
  const gJitter = new Float32Array(groundTotal*2); for (let i=0;i<groundTotal;i++){ gJitter[i*2]=(Math.random()-0.5)*0.14; gJitter[i*2+1]=(Math.random()-0.5)*0.14; }

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:makeGlowTextureCore(), blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:0.4 }));
  glow.scale.set(5,5,1); scene.add(glow);

  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate); const t = clock.getElapsedTime();
    core.rotation.y = t*0.25; coreMat.uniforms.uTime.value = t;
    const s = Math.sin(t*1.3); const breathe = 1+(s>=0?s:-s*s)*0.22; innerGlow.scale.set(2.55*breathe,2.55*breathe,1);
    crossRing.rotation.x = t*0.3+Math.sin(t*0.35)*0.3; satRingGroup.rotation.x = -t*0.22; core.scale.setScalar(1+s*0.05); wireMesh.rotation.y = -t*0.12;
    for (let m=0;m<METEORS;m++){ const mt=meteors[m]; mt.y+=mt.speed; if(mt.y>3){ mt.y=-4; mt.x=(Math.random()-0.5)*20; mt.z=(Math.random()-0.5)*20; } for (let k=0;k<TRAIL;k++){ const idx=(m*TRAIL+k)*3; tPos[idx]=mt.x; tPos[idx+1]=mt.y-k*0.12; tPos[idx+2]=mt.z; } }
    particles.geometry.attributes.position.needsUpdate = true;
    for (let i=0;i<groundTotal;i++){ const col=i%GCOLS, row=(i/GCOLS)|0; const x=(col/(GCOLS-1)-0.5)*22+gJitter[i*2]; const z=(row/(GROWS-1)-0.5)*22+gJitter[i*2+1]; const wave=Math.sin(x*0.4+t*1.0)*0.2+Math.cos(z*0.5+t*0.8)*0.2+Math.sin((x+z)*0.3+t*1.4)*0.12; gPos[i*3]=x; gPos[i*3+1]=wave; gPos[i*3+2]=z; }
    ground.geometry.attributes.position.needsUpdate = true;
    for (let o=0;o<satOrbits.length;o++){ const so=satOrbits[o]; so.angle+=so.speed*0.02; for (let k=0;k<SAT_TRAIL;k++){ const a=so.angle-k*0.02; so.pos[k*3]=Math.cos(a)*so.r; so.pos[k*3+2]=Math.sin(a)*so.r; } so.pts.geometry.attributes.position.needsUpdate=true; }
    glow.material.opacity = 0.45+Math.sin(t*1.6)*0.12;
    renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', ()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); wireMeshMat.resolution.set(window.innerWidth,window.innerHeight); });
}

// ============ 左边大脑框 ============
function initBrain() {
  const canvas = document.getElementById('sceneBrain'); const frame = document.getElementById('brainPanel');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true }); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100); camera.position.set(0,0,4.2);
  const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.autoRotate=true; controls.autoRotateSpeed=0.6; controls.enablePan=false; controls.enableZoom=false;
  const PARTICLE = new THREE.Color(0x3a5f80), LINE = new THREE.Color(0x5a82a8), NODE = new THREE.Color(0x8fb4d8);
  const brainGroup = new THREE.Group(); scene.add(brainGroup);
  const activation = [0.6,0.5,0.7,0.55,0.6,0.75];
  const dotVert = `attribute vec3 color; attribute float aRegion; varying vec3 vColor; uniform float uTime; uniform float uAct[6]; void main(){ float act=uAct[int(aRegion)]; vColor=color*act; vec4 mv=modelViewMatrix*vec4(position,1.0); float pulse=0.9+0.1*sin(uTime*1.5+position.x*3.0+position.y*2.0); gl_PointSize=(1.3+pulse*0.3)*(16.0/-mv.z); gl_Position=projectionMatrix*mv; }`;
  const dotFrag = `varying vec3 vColor; void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c); float a=smoothstep(0.5,0.0,d); gl_FragColor=vec4(vColor,a*a); }`;
  function brainRegion(x,y,z){ if(y<-0.55)return 5; if(z<-0.25&&y<0)return 4; if(z>0.35)return 0; if(z<-0.45)return 2; if(y>0.25)return 1; return 3; }
  function makeGlowTexture(){ const c=document.createElement('canvas'); c.width=c.height=128; const ctx=c.getContext('2d'); const g=ctx.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(210,235,255,0.95)'); g.addColorStop(0.3,'rgba(150,195,245,0.45)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
  const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map:makeGlowTexture(), color:0x9cc4f0, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:0.3 })); coreGlow.scale.set(1.3,1.3,1); brainGroup.add(coreGlow);
  const coreDot = new THREE.Sprite(new THREE.SpriteMaterial({ map:makeGlowTexture(), color:0xe8f2ff, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:0.5 })); coreDot.scale.set(0.9,0.9,1); brainGroup.add(coreDot);
  const PULSE_N = 120, pulsePos = new Float32Array(PULSE_N*3), pulseData = [];
  for (let i=0;i<PULSE_N;i++){ const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1); pulseData.push({ dir:new THREE.Vector3(Math.sin(ph)*Math.cos(th),Math.sin(ph)*Math.sin(th),Math.cos(ph)), life:-Math.random()*2, maxLife:1.2+Math.random()*0.8, speed:0.4+Math.random()*0.5 }); }
  const pulseGeo = new THREE.BufferGeometry(); pulseGeo.setAttribute('position',new THREE.BufferAttribute(pulsePos,3));
  const pulseMat = new THREE.PointsMaterial({ color:0x90c0ff, size:0.04, transparent:true, opacity:0, sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending }); brainGroup.add(new THREE.Points(pulseGeo,pulseMat));

  function resizeBrain(){ const w=frame.clientWidth, h=frame.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); if(window.__brainLinkMat)window.__brainLinkMat.resolution.set(w,h); }

  const loader = new STLLoader();
  loader.load('models/brain-whole.stl', (geometry)=>{
    geometry.computeBoundingBox(); const bb=geometry.boundingBox; const center=bb.getCenter(new THREE.Vector3()); const size=bb.getSize(new THREE.Vector3());
    geometry.translate(-center.x,-center.y,-center.z); const s=2.0/Math.max(size.x,size.y,size.z); geometry.scale(s,s,s); geometry.rotateX(-Math.PI/2); geometry.rotateY(Math.PI); geometry.computeVertexNormals();
    const posAttr=geometry.attributes.position, norAttr=geometry.attributes.normal, total=posAttr.count;
    const PN=200000, used=new Set(), pts=[], cols=[], regs=[]; let guard=0;
    while(pts.length<PN && guard++<1000000){ const i=Math.floor(Math.random()*total); if(used.has(i))continue; used.add(i); const x=posAttr.getX(i)+norAttr.getX(i)*0.01, y=posAttr.getY(i)+norAttr.getY(i)*0.01, z=posAttr.getZ(i)+norAttr.getZ(i)*0.01; pts.push(x,y,z); cols.push(PARTICLE.r,PARTICLE.g,PARTICLE.b); regs.push(brainRegion(x,y,z)); }
    const cell=0.1, grid=new Map(); for(let i=0;i<pts.length;i+=3){ const k=Math.floor(pts[i]/cell)+','+Math.floor(pts[i+1]/cell)+','+Math.floor(pts[i+2]/cell); grid.set(k,(grid.get(k)||0)+1); }
    const fPts=[],fCols=[],fRegs=[]; for(let i=0;i<pts.length;i+=3){ const k=Math.floor(pts[i]/cell)+','+Math.floor(pts[i+1]/cell)+','+Math.floor(pts[i+2]/cell); if((grid.get(k)||0)>=4){ fPts.push(pts[i],pts[i+1],pts[i+2]); fCols.push(cols[i],cols[i+1],cols[i+2]); fRegs.push(regs[i/3]); } }
    const pointGeo = new THREE.BufferGeometry(); pointGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(fPts),3)); pointGeo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(fCols),3)); pointGeo.setAttribute('aRegion',new THREE.BufferAttribute(new Float32Array(fRegs),1));
    const pointMat = new THREE.ShaderMaterial({ uniforms:{ uTime:{value:0}, uAct:{value:activation} }, vertexShader:dotVert, fragmentShader:dotFrag, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
    brainGroup.add(new THREE.Points(pointGeo, pointMat)); window.__brainPointMat = pointMat;
    const NN=240, nodeIdx=new Set(), nodePos=[]; while(nodePos.length<NN){ const i=Math.floor(Math.random()*total); if(nodeIdx.has(i))continue; nodeIdx.add(i); nodePos.push(new THREE.Vector3(posAttr.getX(i),posAttr.getY(i),posAttr.getZ(i))); }
    const linkArr=[]; for(let i=0;i<NN;i++){ const d=[]; for(let j=0;j<NN;j++){ if(i===j)continue; d.push([j,nodePos[i].distanceTo(nodePos[j])]); } d.sort((a,b)=>a[1]-b[1]); for(let k=0;k<2;k++){ const j=d[k][0]; if(j>i)linkArr.push(nodePos[i].x,nodePos[i].y,nodePos[i].z,nodePos[j].x,nodePos[j].y,nodePos[j].z); } }
    const linkGeo = new LineSegmentsGeometry(); linkGeo.setPositions(linkArr); const linkMat = new LineMaterial({ color:LINE, linewidth:1.3, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending, depthWrite:false }); brainGroup.add(new Line2(linkGeo,linkMat)); window.__brainLinkMat = linkMat;
    resizeBrain();
  });

  const clock = new THREE.Clock(); let think = 0;
  function animate(){
    requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime; controls.update();
    think = Math.max(0,Math.sin(t*0.35)*0.5+0.5)*(0.6+0.4*Math.pow(Math.sin(t*1.8),2));
    activation[0]=0.5+think*0.5+Math.sin(t*0.9)*0.08; activation[1]=0.45+think*0.3+Math.sin(t*1.3)*0.06; activation[2]=0.55+think*0.25+Math.sin(t*0.7)*0.07; activation[3]=0.5+think*0.35+Math.sin(t*1.1)*0.06; activation[4]=0.5+think*0.3+Math.sin(t*0.6)*0.05; activation[5]=0.65+Math.sin(t*1.5)*0.1;
    activation.forEach((v,i)=>activation[i]=Math.max(0.25,Math.min(1,v)));
    if(window.__brainPointMat){ window.__brainPointMat.uniforms.uAct.value=activation; window.__brainPointMat.uniforms.uTime.value=t; }
    coreGlow.scale.set(1.3*(1+Math.sin(t*1.5)*0.15),1.3*(1+Math.sin(t*1.5)*0.15),1); coreGlow.material.opacity=0.2+Math.sin(t*1.5)*0.04+think*0.15; coreDot.material.opacity=0.35+think*0.4;
    for(let i=0;i<PULSE_N;i++){ const d=pulseData[i]; d.life+=dt*(0.25+think*0.35); if(d.life>d.maxLife)d.life=0; const r=d.life*d.speed; pulsePos[i*3]=d.dir.x*r; pulsePos[i*3+1]=d.dir.y*r; pulsePos[i*3+2]=d.dir.z*r; }
    pulseGeo.attributes.position.needsUpdate=true; pulseMat.opacity=0.25+think*0.35;
    document.getElementById('vFrontal').textContent=(activation[0]*100).toFixed(0)+'%';
    document.getElementById('vParietal').textContent=(activation[1]*100).toFixed(0)+'%';
    document.getElementById('vOccipital').textContent=(activation[2]*100).toFixed(0)+'%';
    document.getElementById('vTemporalL').textContent=(activation[3]*100).toFixed(0)+'%';
    document.getElementById('vTemporalR').textContent=((activation[3]+0.05)*100).toFixed(0)+'%';
    document.getElementById('vCerebellum').textContent=(activation[4]*100).toFixed(0)+'%';
    document.getElementById('vBrainstem').textContent=(activation[5]*100).toFixed(0)+'%';
    window.__think = think;
    renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', resizeBrain);
  resizeBrain();
}

// ============ 脑电波 + 数据 ============
function initData() {
  const eegCanvas = document.getElementById('eegCanvas'); const eegCtx = eegCanvas.getContext('2d'); let eegOffset = 0;
  const waves = [
    { name:'δ', hz:'0.5-4Hz', f:1.2, amp:6, color:'rgba(110,150,200,0.8)' },
    { name:'θ', hz:'4-8Hz', f:2.5, amp:5, color:'rgba(120,160,215,0.8)' },
    { name:'α', hz:'8-13Hz', f:5.0, amp:5, color:'rgba(140,180,230,0.85)' },
    { name:'β', hz:'13-30Hz', f:9.0, amp:4, color:'rgba(160,200,245,0.9)' },
    { name:'γ', hz:'30-100Hz', f:16.0, amp:3, color:'rgba(180,220,255,0.95)' },
  ];
  const wavesLabel = document.getElementById('wavesLabel');
  waves.forEach(w => { const i = document.createElement('i'); i.textContent = `${w.name} ${w.hz}`; i.dataset.name = w.name; wavesLabel.appendChild(i); });
  function drawEEG(think) {
    const w = eegCanvas.width = eegCanvas.clientWidth, h = eegCanvas.height = eegCanvas.clientHeight; eegCtx.clearRect(0,0,w,h);
    waves.forEach(wave => {
      eegCtx.beginPath(); const ampScale = (wave.name==='β'||wave.name==='γ') ? (1+think*0.8) : 1;
      for (let x=0;x<w;x++){ const t=(x+eegOffset)/w*30; const y=h/2+Math.sin(t*wave.f*0.35)*wave.amp*ampScale+Math.sin(t*wave.f*0.9)*wave.amp*0.4+(Math.random()-0.5)*1.5; if(x===0)eegCtx.moveTo(x,y); else eegCtx.lineTo(x,y); }
      eegCtx.strokeStyle = wave.color; eegCtx.lineWidth = 1.2; eegCtx.stroke();
    });
    eegOffset += 1.2;
  }

  function tick() {
    const think = window.__think || 0;
    drawEEG(think);
    document.getElementById('sLatency').textContent = Math.floor(12+Math.random()*30)+'ms';
    document.getElementById('sCpu').textContent = Math.floor(20+Math.random()*60)+'%';
    document.getElementById('sMem').textContent = Math.floor(40+Math.random()*30)+'%';
    document.getElementById('sTemp').textContent = (38+Math.random()*8).toFixed(1)+'°';
    const labels = wavesLabel.querySelectorAll('i'); labels.forEach(el => { const n=el.dataset.name; el.className = (think>0.5&&(n==='β'||n==='γ'))?'on':''; });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  setInterval(() => {
    const states=['清醒','专注','思考','分析','待命'], focus=['待命','对话处理','数据分析','交易监测','记忆整理'];
    document.getElementById('cState').textContent = states[Math.floor(Math.random()*states.length)];
    document.getElementById('cFocus').textContent = focus[Math.floor(Math.random()*focus.length)];
    document.getElementById('cLoad').textContent = Math.floor(30+Math.random()*60)+'%';
    document.getElementById('cEmotion').textContent = ['平稳','专注','好奇','警觉'][Math.floor(Math.random()*4)];
    document.getElementById('cAuto').textContent = Math.floor(65+Math.random()*25)+'%';
  }, 2500);

  const hotTopics = ['人工智能大模型新突破','新能源汽车销量创新高','数字经济政策解读','半导体产业投资升温','量子计算取得进展','生物医药板块走强','低空经济加速落地','人形机器人量产在即'];
  const hotList = document.getElementById('hotList');
  hotTopics.forEach((topic,i)=>{ const d=document.createElement('div'); d.className='hot-item'; d.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b>${topic}`; hotList.appendChild(d); });

  const kc = document.getElementById('klineCanvas'); const kctx = kc.getContext('2d');
  const kData = []; let price = 3200;
  for (let i=0;i<40;i++){ const o=price, c=price+(Math.random()-0.5)*60, h=Math.max(o,c)+Math.random()*30, l=Math.min(o,c)-Math.random()*30; kData.push({o,c,h,l}); price=c; }
  function drawKline(){ const w=kc.width=kc.clientWidth, h=kc.height=kc.clientHeight; kctx.clearRect(0,0,w,h); const max=Math.max(...kData.map(k=>k.h)), min=Math.min(...kData.map(k=>k.l)); const step=w/kData.length; kData.forEach((k,i)=>{ const x=i*step+step/2, y=(v)=>h-(v-min)/(max-min)*(h-8)-4; kctx.strokeStyle='rgba(150,190,240,0.5)'; kctx.beginPath(); kctx.moveTo(x,y(k.h)); kctx.lineTo(x,y(k.l)); kctx.stroke(); kctx.fillStyle=k.c>=k.o?'rgba(120,220,180,0.85)':'rgba(230,120,140,0.85)'; const bh=Math.max(1,Math.abs(y(k.o)-y(k.c))); kctx.fillRect(x-2,Math.min(y(k.o),y(k.c)),4,bh); }); }
  drawKline();
  setInterval(()=>{ kData.shift(); const o=price, c=price+(Math.random()-0.5)*60, h=Math.max(o,c)+Math.random()*30, l=Math.min(o,c)-Math.random()*30; kData.push({o,c,h,l}); price=c; drawKline(); }, 2000);

  const chatInput=document.getElementById('chatInput'), sendBtn=document.getElementById('sendBtn'), voiceBtn=document.getElementById('voiceBtn'), reply=document.getElementById('reply');
  function showReply(text){ reply.textContent=text; reply.classList.add('show'); }
  function send(){ const v=chatInput.value.trim(); if(!v)return; chatInput.value=''; showReply('GINA 回复中…'); setTimeout(()=>showReply('已收到：「'+v+'」—— 视觉原型，接入后端后由 Gina 实时回复。'),420); }
  sendBtn.addEventListener('click',send); chatInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } }); voiceBtn.addEventListener('click',()=>voiceBtn.classList.toggle('rec'));
  showReply('Gina 全息驾驶舱已就绪。');
}

function updateClock(){ const n=new Date(); document.getElementById('clock').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':'); }
setInterval(updateClock,1000); updateClock();

initEnergyCore();
initBrain();
initData();
</script>
